    async function extractPdfPages(file) {
      await ensurePdfLib();
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
      const pages = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        showProcessingProgress(i - 1, pdf.numPages, `Reading page ${i} of ${pdf.numPages}…`);
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const rawText = textContent.items.map(it => it.str).join(' ').replace(/\s+/g, ' ').trim();

        // Render at a crisp resolution — Firestore allows up to ~1MB/doc, so we budget generously
        // and only step quality down if a page genuinely needs it (dense scans/photos).
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;

        let quality = 0.9;
        let imageDataUrl = canvas.toDataURL('image/jpeg', quality);
        while (imageDataUrl.length > 900000 && quality > 0.4) {
          quality -= 0.12;
          imageDataUrl = canvas.toDataURL('image/jpeg', quality);
        }

        pages.push({ rawText, imageDataUrl });
      }
      return pages;
    }

    async function extractPptxSlides(file) {
      await ensureJsZip();
      const buf = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buf);
      const slideFiles = Object.keys(zip.files)
        .filter(name => /^ppt\/slides\/slide\d+\.xml$/.test(name))
        .sort((a, b) => {
          const na = parseInt(a.match(/slide(\d+)\.xml/)[1]);
          const nb = parseInt(b.match(/slide(\d+)\.xml/)[1]);
          return na - nb;
        });

      const pages = [];
      for (let i = 0; i < slideFiles.length; i++) {
        showProcessingProgress(i, slideFiles.length, `Reading slide ${i + 1} of ${slideFiles.length}…`);
        const slidePath = slideFiles[i];
        const xml = await zip.files[slidePath].async('string');
        const matches = [...xml.matchAll(/<a:t>([^<]*)<\/a:t>/g)];
        const rawText = matches.map(m => m[1]).join(' ').replace(/\s+/g, ' ').trim();

        // Best-effort: pull the pictures that were placed on this slide (not a pixel-perfect
        // layout — true PPTX rendering needs a heavy engine — but real slide images beat plain text).
        const slideImages = [];
        try {
          const slideNum = slidePath.match(/slide(\d+)\.xml/)[1];
          const relsPath = `ppt/slides/_rels/slide${slideNum}.xml.rels`;
          if (zip.files[relsPath]) {
            const relsXml = await zip.files[relsPath].async('string');
            const relMap = {};
            for (const m of relsXml.matchAll(/<Relationship[^>]*Id="([^"]+)"[^>]*Target="([^"]+)"/g)) {
              relMap[m[1]] = m[2];
            }
            const embedIds = [...xml.matchAll(/r:embed="([^"]+)"/g)].map(m => m[1]);
            let count = 0;
            for (const rid of embedIds) {
              if (count >= 3) break; // cap per slide to keep the Firestore doc small
              const target = relMap[rid];
              if (!target || !/\.(png|jpe?g|gif)$/i.test(target)) continue;
              const mediaPath = 'ppt/media/' + target.split('/').pop();
              if (!zip.files[mediaPath]) continue;
              try {
                const blob = await zip.files[mediaPath].async('blob');
                const dataUrl = await compressImageFile(blob, 900, 0.8);
                slideImages.push(dataUrl);
                count++;
              } catch (e) { /* skip this image, keep going */ }
            }
          }
        } catch (e) { console.error('slide image extract failed', e); }

        pages.push({ rawText, imageDataUrl: null, slideImages });
      }
      return pages;
    }

For any term, concept, or regulation searched by the user, you must structure the response strictly into these three short points, keeping every point strictly to **one single line** (maximum 1-2 short sentences):

    async function aiTrainerAsk(query, lang, systemOverride) {
      const sys = systemOverride || (AI_TRAINER_SYSTEM + (lang === 'ur' ? ' If the user writes in Urdu, respond in Urdu (Roman or Urdu script as appropriate).' : ''));
      const messages = [
        { role: 'system', content: sys },
        { role: 'user', content: query }
      ];

      // Call our own backend proxy (server.js locally / Cloud Function in prod) —
      // the Bluesmind API key stays server-side only and is never sent to the browser.
      const res = await fetch(AI_PROXY_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: BLUESMIND_MODEL, messages, temperature: 0.4 })
      });
      if (!res.ok) {
        const t = await res.text();
        throw new Error('AI request failed (' + res.status + '). ' + (t || '').slice(0, 180));
      }
      const data = await res.json();
      return (data && data.content) ? data.content.trim() : '';
    }

    function submitWrongFeedbackAndContinue() {
      const feedbackEl = document.getElementById('wrongAnswerFeedback');
      const errorEl = document.getElementById('feedbackError');
      const feedback = feedbackEl ? feedbackEl.value.trim() : '';
      const quiz = state.takingQuiz;
      const qi = state.qIndex;
      const attempt = state.attempt;

      // Feedback is now MANDATORY
      if (!feedback) {
        if (feedbackEl) feedbackEl.focus();
        if (errorEl) errorEl.style.display = 'block';
        return;
      }
      if (errorEl) errorEl.style.display = 'none';

      if (!attempt.questionFeedback) attempt.questionFeedback = {};
      attempt.questionFeedback[qi] = feedback;

      state._locked = false;
      setTimeout(() => {
        if (state.qIndex < state.takingQuiz.questions.length - 1) {
          state.qIndex++;
          renderParticipantQuiz();
          startQuestionTimer();
        } else {
          finishAttempt(false);
        }
      }, 300);
    }

    function isTrainingExpired(training) {
      const now = Date.now();
      if (training.expiresOn) {
        const expiryDate = new Date(training.expiresOn + 'T23:59:59');
        if (expiryDate.getTime() < now) return true;
      }
      if (training.createdAt && training.expiresDays) {
        const expiryTime = training.createdAt + (training.expiresDays * 24 * 60 * 60 * 1000);
        if (expiryTime < now) return true;
      }
      return false;
    }

    function getTrainingExpiryInfo(training) {
      const now = Date.now();
      if (training.expiresOn) {
        const expiryDate = new Date(training.expiresOn + 'T23:59:59');
        const daysLeft = Math.ceil((expiryDate.getTime() - now) / (24 * 60 * 60 * 1000));
        return `⏰ Expires in ${daysLeft} day${daysLeft !== 1 ? 's' : ''}`;
      }
      if (training.createdAt && training.expiresDays) {
        const expiryTime = training.createdAt + (training.expiresDays * 24 * 60 * 60 * 1000);
        const daysLeft = Math.ceil((expiryTime - now) / (24 * 60 * 60 * 1000));
        return `⏰ Expires in ${daysLeft} day${daysLeft !== 1 ? 's' : ''}`;
      }
      return '';
    }

    function formatExpiry(training) {
      if (training.expiresOn) {
        const expiryDate = new Date(training.expiresOn);
        return expiryDate.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
      }
      if (training.createdAt && training.expiresDays) {
        const expiryDate = new Date(training.createdAt + (training.expiresDays * 24 * 60 * 60 * 1000));
        return expiryDate.toLocaleDateString('en-GB', { year: 'numeric', month: 'short', day: 'numeric' });
      }
      return 'No expiry';
    }

    async function saveExpiryForTraining(trainingId) {
      const expiryDaysInput = document.getElementById(`expiryDays-${trainingId}`);
      const expiryHoursInput = document.getElementById(`expiryHours-${trainingId}`);

      let days = parseInt(expiryDaysInput.value) || 0;
      let hours = parseInt(expiryHoursInput.value) || 0;

      if (days < 0 || hours < 0 || hours >= 24) {
        showToast('Please enter valid expiry values', 'error');
        return;
      }

      const list = (await sGet('training-list')) || [];
      const idx = list.findIndex(m => m.id === trainingId);
      if (idx < 0) return;

      const m = list[idx];
      if (days > 0 || hours > 0) {
        const now = new Date();
        const newExpiry = new Date(now.getTime() + ((days * 24) + hours) * 60 * 60 * 1000);
        m.expiresOn = newExpiry.toISOString().split('T')[0];
        m.expiresDays = days;
        m.expiresHours = hours;
      } else {
        delete m.expiresOn;
        delete m.expiresDays;
        delete m.expiresHours;
      }

      await sSet('training-list', list);
      showToast('Expiry settings saved', 'success');
      if (state.screen === 'admin-academy') renderAdminAcademy();
    }

    // ========== EXPIRY REQUEST FUNCTIONS ==========
    // type: 'training' | 'quiz'. itemId is the training id or quiz id (same code space).
    // reason is the team member's written justification, shown to the Admin for approval.
    async function createExpiryRequest(type, itemId, title, reason) {
      const requests = await sGet('expiry-requests') || [];
      const existingRequest = requests.find(r =>
        r.itemId === itemId &&
        r.userId === state.user.uid &&
        !r.adminApproved &&
        !r.rejectedAt
      );
      if (existingRequest) {
        showToast('You have already requested access to this — please wait for Admin approval.', 'warning');
        return false;
      }
      const request = {
        id: Date.now() + '-' + Math.random().toString(36).substr(2, 9),
        type,
        itemId,
        title: title || itemId,
        reason: reason || '',
        userId: state.user.uid,
        userName: state.profile ? state.profile.name : '',
        userDept: state.profile ? state.profile.department : '',
        requestedAt: Date.now(),
        adminApproved: false,
        approvedAt: null,
        rejectedAt: null
      };
      requests.push(request);
      await sSet('expiry-requests', requests);
      showToast('✅ Request sent to Admin for approval', 'success');
      return true;
    }

    async function submitExpiryRequest(trainingId, reason, title) {
      const training = await sGet('training:' + trainingId);
      if (!training) { showToast('Training not found', 'error'); return; }
      await createExpiryRequest('training', trainingId, title || training.title, reason);
      if (state.screen === 'member-home') renderMemberHome();
    }

    async function submitQuizExpiryRequest(quizId, reason, title) {
      const quiz = await sGet('quiz:' + quizId);
      if (!quiz) { showToast('Quiz not found', 'error'); return; }
      await createExpiryRequest('quiz', quizId, title || quiz.title, reason);
      if (state.screen === 'member-home') renderMemberHome();
    }

    // Shared modal: shown whenever a team member tries to open an expired training
    // or assessment they haven't already been unlocked for. Collects a written reason
    // and sends it to the Admin as a pending expiry request.
    function showExpiryRequestModal(type, itemId, title) {
      const modal = document.createElement('div');
      modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;';
      modal.innerHTML = `
        <div class="card" style="width:100%;max-width:420px;padding:24px;">
          <h3 style="margin-top:0;color:var(--bad-600);font-size:16px;">${type === 'quiz' ? 'Assessment' : 'Training'} Expired</h3>
          <p style="color:var(--ink-600);font-size:14px;margin-bottom:16px;">"${escapeHtml(title || '')}" has expired and is no longer available for immediate access. Send a written request to your Admin to unlock it.</p>
          <div class="field" style="margin-bottom:6px;">
            <label>Reason for access request (required)</label>
            <textarea id="expiryReqReason" placeholder="e.g. I need to complete this before my compliance review on…" style="min-height:80px;"></textarea>
            <div id="expiryReqReasonError" class="hint" style="display:none;color:var(--bad-600);font-weight:600;margin-top:4px;">Please enter a reason before sending.</div>

      `;

    // ========== EXPIRY DATE CHANGE BUTTONS (removed — replaced by per-training controls) ==========
    function isQuizExpired(quiz) {
      const now = Date.now();
      if (quiz.expiresOn) {
        const expiryDate = new Date(quiz.expiresOn + 'T23:59:59');
        if (expiryDate.getTime() < now) return true;
      }
      if (quiz.createdAt && quiz.expiresDays) {
        const expiryTime = quiz.createdAt + (quiz.expiresDays * 24 * 60 * 60 * 1000);
        if (expiryTime < now) return true;
      }
      return false;
    }
    function getExpiryInfo(quiz) {
      const now = Date.now();
      if (quiz.expiresOn) {
        const expiryDate = new Date(quiz.expiresOn + 'T23:59:59');
        const daysLeft = Math.ceil((expiryDate.getTime() - now) / (24 * 60 * 60 * 1000));
        return `⏰ Expires in ${daysLeft} day${daysLeft !== 1 ? 's' : ''}`;
      }
      if (quiz.createdAt && quiz.expiresDays) {
        const expiryTime = quiz.createdAt + (quiz.expiresDays * 24 * 60 * 60 * 1000);
        const daysLeft = Math.ceil((expiryTime - now) / (24 * 60 * 60 * 1000));
        return `⏰ Expires in ${daysLeft} day${daysLeft !== 1 ? 's' : ''}`;
      }
      return '';
    }

    async function startAssessmentFlow(quiz) {
      let isPostExpiryUnlock = false;
      if (state.profile && state.profile.role === 'member') {
        const unlocked = (await sGet('user-unlocked-trainings:' + state.user.uid)) || [];
        if (isQuizExpired(quiz) && !unlocked.includes(quiz.id)) {
          showExpiryRequestModal('quiz', quiz.id, quiz.title);
          return;
        }
        // If the quiz is currently expired but the user is already on the unlock list,
        // that access can only have come from an admin-approved expiry request — tag it.
        if (isQuizExpired(quiz) && unlocked.includes(quiz.id)) {
          isPostExpiryUnlock = true;
        }
        if (!unlocked.includes(quiz.id)) {
          unlocked.push(quiz.id);
          await sSet('user-unlocked-trainings:' + state.user.uid, unlocked);
        }
      }
      const myAttempts = (await sGet('user-attempts:' + state.user.uid)) || [];
      const prior = myAttempts.filter(x => x.quizId === quiz.id);
      let confirmedRetake = false;
      if (prior.length > 0) {
        const best = Math.max(...prior.map(x => x.pct));
        const ok = confirm(`You've already taken "${quiz.title}" before (${prior.length} attempt(s), best score ${best}%).\n\nTaking it again will create a NEW, separate attempt record — your earlier result will not change.\n\nContinue?\n\n(Aap yeh assessment pehle bhi de chuke hain. Dobara dene se ek naya, alag attempt record banega — pehla result tabdeel nahi hoga.)`);
        if (!ok) return;
        confirmedRetake = true;
      }
      state.takingQuiz = buildShuffledQuiz(quiz);
      state.attempt = {
        name: state.profile.name, uid: state.user.uid,
        department: state.profile.department, designation: state.profile.designation,
        answers: [], perQuestion: [], violations: [], startedAt: Date.now(),
        isRetake: confirmedRetake, isPostExpiryUnlock: isPostExpiryUnlock
      };
      state.qIndex = 0;
      goto('proctor-gate');
    }

    /* =========================================================
       PROCTORING GATE + ANTI-CHEAT
    ========================================================= */
    function renderProctorGate() {
      const quiz = state.takingQuiz;
      app.innerHTML = `
    <div class="wrap narrow" style="padding-top:26px;">
      <div class="card proctor-gate">
        <div class="seal"><span class="icon-3d">&#128737;</span></div>
        <h2 style="margin-bottom:4px;">${escapeHtml(quiz.title)}</h2>
        <p style="color:var(--ink-600);font-size:13.5px;margin:0;">This is a proctored assessment</p>
        <ul>
          <li>Each question has a fixed time limit. Once the time for a question expires, it will automatically move to the next question.</li>
          <li>Once the assessment has started, it cannot be paused or restarted.</li>
          <li>Retaking the assessment may have a negative impact on your final result, where applicable.</li>
          ${quiz.proctoring && quiz.proctoring.enabled && quiz.proctoring.autoSubmitAfter > 0 ? `<li>The assessment will auto-submit $ {quiz.proctoring.autoSubmitAfter}.</li>` : ''}
        </ul>
        <button class="btn btn-navy btn-block" onclick="beginProctoredQuiz()">Start Assessment (Full-Screen)</button>
      </div>
    </div>

    function beginProctoredQuiz() {
      const el = document.documentElement;
      if (el.requestFullscreen) { el.requestFullscreen().catch(() => { }); }
      attachProctoring();
      goto('p-quiz');
      startQuestionTimer();
    }

    let _violationLock = false;
    function attachProctoring() {
      _violationLock = false;
      state._onVis = () => { if (document.hidden) logViolation('tab_hidden'); };
      state._onBlur = () => { logViolation('window_blur'); };
      state._onFsChange = () => { if (!document.fullscreenElement) logViolation('fullscreen_exit'); };
      state._onContext = e => { e.preventDefault(); };
      state._onCopy = e => { e.preventDefault(); };
      state._onKey = e => {
        const k = e.key.toLowerCase();
        const blocked = (e.ctrlKey || e.metaKey) && ['c', 'v', 'x', 'u', 'p', 's'].includes(k);
        if (blocked || k === 'f12') { e.preventDefault(); }
      };
      document.addEventListener('visibilitychange', state._onVis);
      window.addEventListener('blur', state._onBlur);
      document.addEventListener('fullscreenchange', state._onFsChange);
      document.addEventListener('contextmenu', state._onContext);
      document.addEventListener('copy', state._onCopy);
      document.addEventListener('cut', state._onCopy);
      document.addEventListener('paste', state._onCopy);
      document.addEventListener('keydown', state._onKey);
    }
    function detachProctoring() {
      if (state._onVis) document.removeEventListener('visibilitychange', state._onVis);
      if (state._onBlur) window.removeEventListener('blur', state._onBlur);
      if (state._onFsChange) document.removeEventListener('fullscreenchange', state._onFsChange);
      if (state._onContext) document.removeEventListener('contextmenu', state._onContext);
      if (state._onCopy) { document.removeEventListener('copy', state._onCopy); document.removeEventListener('cut', state._onCopy); document.removeEventListener('paste', state._onCopy); }
      if (state._onKey) document.removeEventListener('keydown', state._onKey);
      if (document.fullscreenElement) { document.exitFullscreen().catch(() => { }); }
    }
    function logViolation(type) {
      if (!state.attempt || state.screen !== 'p-quiz') return;
      state.attempt.violations.push({ type, at: Date.now() });
      showViolationBanner(type);
      const proc = state.takingQuiz.proctoring;
      if (proc && proc.enabled && proc.autoSubmitAfter > 0 && state.attempt.violations.length >= proc.autoSubmitAfter && !_violationLock) {
        _violationLock = true;
        stopTimer();
        showToast('Too many integrity warnings — the assessment is being auto-submitted. (Bohat zyada warnings — auto-submit ho rahi hai.)', 'error');
        setTimeout(() => finishAttempt(true), 1200);
      }
    }
    function showViolationBanner(type) {
      const b = document.getElementById('violationBanner');
      if (!b) return;
      b.textContent = '⚠ ' + friendlyViolation(type) + ' — logged';
      b.className = 'violation-banner show';
      clearTimeout(b._h);
      b._h = setTimeout(() => { b.className = 'violation-banner'; }, 3000);
    }

    // ========== EXPIRY REQUEST APPROVAL ==========
    async function loadPendingExpiryRequests() {
      const list = (await sGet('expiry-requests')) || [];
      const pending = list.filter(r => r && !r.adminApproved && !r.rejectedAt);
      pending.sort((a, b) => (a.requestedAt || 0) - (b.requestedAt || 0)); // oldest first
      return pending;
    }

    function timeAgoLabel(ts) {
      const diffMs = Date.now() - (ts || Date.now());
      const mins = Math.max(0, Math.floor(diffMs / 60000));
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }

    function renderExpiryTimers(requests) {
      const container = document.getElementById('expiryRequestsContainer');
      const countEl = document.getElementById('expiryCount');
      if (!container) return;
      if (countEl) countEl.textContent = requests.length;
      if (requests.length === 0) {
        container.innerHTML = '<span class="hint">No pending expiry requests.</span>';
        return;
      }
      container.innerHTML = requests.map(req => `
        <div class="req-row" style="flex-direction:column;align-items:stretch;gap:8px;">
          <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;">
            <div class="ri">
              <div class="n">${escapeHtml(req.title || req.itemId)} <span class="type-pill" style="margin-left:6px;">${req.type === 'quiz' ? 'Assessment' : 'Training'}</span></div>
              <div class="m">${escapeHtml(req.userName || '')} ${req.userDept ? '&middot; ' + escapeHtml(req.userDept) : ''} &middot; requested ${timeAgoLabel(req.requestedAt)}</div>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn btn-navy btn-sm" onclick="approveExpiry('${req.id}')">Approve</button>
              <button class="btn btn-danger btn-sm" onclick="rejectExpiry('${req.id}')">Reject</button>
            </div>
          </div>
          ${req.reason ? `<div class="academy-text" style="font-size:13px;background:var(--paper-dim);padding:8px 10px;border-radius:8px;">${escapeHtml(req.reason)}</div>` : ''}
        </div>
      `).join('');
    }

    function startExpiryCountdown() {
      if (window.expiryInterval) clearInterval(window.expiryInterval);
      window.expiryInterval = setInterval(async () => {
        if (state.screen !== 'admin-team') { clearInterval(window.expiryInterval); return; }
        const requests = await loadPendingExpiryRequests();
        renderExpiryTimers(requests);
      }, 60000); // refresh every 60 seconds so new requests show up while the admin is on this page
    }

    async function approveExpiry(requestId) {
      const list = (await sGet('expiry-requests')) || [];
      const idx = list.findIndex(r => r.id === requestId);
      if (idx < 0) return;
      list[idx].adminApproved = true;
      list[idx].approvedAt = Date.now();
      await sSet('expiry-requests', list);

      // Actually grant access: add this item to the requesting user's unlock list
      // so the training/quiz opens for them immediately, bypassing the expiry check.
      const req = list[idx];
      const userUnlocked = (await sGet('user-unlocked-trainings:' + req.userId)) || [];
      if (!userUnlocked.includes(req.itemId)) {
        userUnlocked.push(req.itemId);
        await sSet('user-unlocked-trainings:' + req.userId, userUnlocked);
      }

      showToast('✅ Request approved — unlocked for ' + (req.userName || 'the team member'), 'success');
      renderAdminTeam();
    }

    async function rejectExpiry(requestId) {
      const list = (await sGet('expiry-requests')) || [];
      const idx = list.findIndex(r => r.id === requestId);
      if (idx < 0) return;
      list[idx].rejectedAt = Date.now();
      await sSet('expiry-requests', list);
      showToast('❌ Request rejected', 'error');
      renderAdminTeam();
    }

    // ========== EXPIRY DATE CHANGE BUTTONS ==========
    async function changeExpiryHours(trainingId, hours) {
      const list = (await sGet('training-list')) || [];
      const idx = list.findIndex(m => m.id === trainingId);
      if (idx < 0) return;

      const m = list[idx];
      const now = new Date();
      const newExpiry = new Date(now.getTime() + hours * 60 * 60 * 1000);
      const expiryDateStr = newExpiry.toISOString().split('T')[0];

      m.expiresOn = expiryDateStr;
      m.expiresDays = Math.ceil(hours / 24);

      await sSet('training-list', list);
      showToast(`Expiry changed to ${hours} hour${hours !== 1 ? 's' : ''}`, 'success');
      if (state.screen === 'admin-academy') renderAdminAcademy();
    }

    /* =========================================================
       PARTICIPANT — TAKING QUIZ
    ========================================================= */
    function currentQuestion() { return state.takingQuiz.questions[state.qIndex]; }

    function renderParticipantQuiz() {
      const quiz = state.takingQuiz;
      const qi = state.qIndex;
      const q = currentQuestion();
      const total = quiz.questions.length;
      const isMulti = q.type === 'multi';
      state._multiSelection = [];

      app.innerHTML = `
    <div class="wrap narrow no-select" style="padding-top:14px;" oncontextmenu="return false;">
      <div class="progress-wrap">
        <div style="display:flex;align-items:center;gap:16px;">
          <div style="flex:1;">
            <div class="progress-bar"><div class="progress-fill" style="width:${(qi / total) * 100}%;"></div></div>
            <div class="progress-label"><span>Question ${qi + 1} of ${total}</span><span>${escapeHtml(state.attempt.name)}</span></div>
          </div>
          <div class="timer-ring" id="timerRing">${state.timeLeft}</div>
        </div>
      </div>
      <div class="card">
        <div class="q-header">
          <div class="q-text">${escapeHtml(q.text)}${isMulti ? ' <span class="hint" style="display:block;font-weight:600;margin-top:6px;">(Select all that apply)</span>' : ''}</div>
        </div>
        <div class="options-grid" id="optGrid">
          ${q.options.map((opt, oi) => `
            <button class="opt-btn" onclick="selectOption(${oi})">
              <span class="tag">${String.fromCharCode(65 + oi)}</span>
              <span>${escapeHtml(opt)}</span>
            </button>
          `).join('')}
        </div>
        ${isMulti ? `<button class="btn btn-navy btn-block" style="margin-top:16px;" id="multiSubmitBtn" onclick="submitMultiAnswer()">Submit Answer</button>` : `<button class="btn btn-navy btn-block" style="margin-top:16px;" id="singleSubmitBtn" onclick="submitSingleAnswer()">Submit Answer</button>`}
        ${!isMulti ? `<span class="hint" style="display:block;font-weight:600;margin-top:6px;">(Select one option)</span>` : ''}
      </div>
    </div>
  `;
    }

    function selectOption(oi) {
      const q = currentQuestion();
      if (q.type === 'multi') {
        if (state._locked) return;
        const idx = state._multiSelection.indexOf(oi);
        if (idx >= 0) state._multiSelection.splice(idx, 1); else state._multiSelection.push(oi);
        const buttons = document.querySelectorAll('#optGrid .opt-btn');
        buttons.forEach((b, bi) => b.classList.toggle('selected', state._multiSelection.includes(bi)));
        return;
      }
      if (state._locked) return;
      // For single-answer questions, just mark the selection (no auto-submit).
      state._selectedSingle = (state._selectedSingle === oi) ? -1 : oi;
      const buttons = document.querySelectorAll('#optGrid .opt-btn');
      buttons.forEach((b, bi) => {
        b.classList.toggle('selected', bi === state._selectedSingle);
      });
      updateSubmitButtonState();
    }
    function updateSubmitButtonState() {
      const btn = document.getElementById('singleSubmitBtn');
      if (btn) btn.disabled = (state._selectedSingle < 0);
    }
    function submitSingleAnswer() {
      if (state._locked) return;
      if (state._selectedSingle < 0) { showToast('Please select an answer first.', 'error'); return; }
      state._locked = true;
      stopTimer();
      submitAnswer(state._selectedSingle);
    }
    function submitMultiAnswer() {
      if (state._locked) return;
      state._locked = true;
      stopTimer();
      submitAnswer(state._multiSelection.slice());
    }

    function startQuestionTimer() {
      stopTimer();
      state._locked = false;
      const q = currentQuestion();
      state.timeLeft = q.timeLimit || state.takingQuiz.timePerQ || 60;
      state._qStart = Date.now();
      updateTimerDisplay();
      state.timerInterval = setInterval(() => {
        state.timeLeft--;
        updateTimerDisplay();
        if (state.timeLeft <= 0) {
          stopTimer();
          if (!state._locked) {
            state._locked = true;
            submitAnswer(q.type === 'multi' ? state._multiSelection.slice() : -1);
          }
        }
      }, 1000);
    }
    function updateTimerDisplay() {
      const ring = document.getElementById('timerRing');
      if (ring) {
        ring.textContent = Math.max(0, state.timeLeft);
        ring.className = 'timer-ring' + (state.timeLeft <= 5 ? ' low' : '');
      }
    }

    function isAnswerCorrect(q, given) {
      if (q.type === 'multi') {
        const correctSet = (Array.isArray(q.correct) ? q.correct.slice() : [q.correct]).sort().join(',');
        const givenSet = Array.isArray(given) ? given.slice().sort().join(',') : '';
        return correctSet.length > 0 && correctSet === givenSet;
      }
      return given === q.correct;
    }

    function submitAnswer(oi) {
      const q = currentQuestion();
      const timeMs = Date.now() - state._qStart;
      const correct = isAnswerCorrect(q, oi);
      state.attempt.answers.push(oi);
      state.attempt.perQuestion.push({ correct, given: oi, timeMs });

      const buttons = document.querySelectorAll('#optGrid .opt-btn');
      const correctSet = q.type === 'multi' ? (Array.isArray(q.correct) ? q.correct : [q.correct]) : [q.correct];
      const givenSet = Array.isArray(oi) ? oi : [oi];
      buttons.forEach((b, idx) => {
        b.disabled = true;
        if (correctSet.includes(idx)) b.classList.add('correct');
        else if (givenSet.includes(idx)) b.classList.add('wrong');
      });
      const multiBtn = document.getElementById('multiSubmitBtn');
      if (multiBtn) multiBtn.disabled = true;

      // For team members who select wrong answer, stop quiz and show explanation
      if (!correct && state.profile && state.profile.role === 'member') {
        state._lastGivenAnswer = oi;
        stopQuizAndShowExplanation(q, oi);
        return;
      }

      setTimeout(() => {
        if (state.qIndex < state.takingQuiz.questions.length - 1) {
          state.qIndex++;
          renderParticipantQuiz();
          startQuestionTimer();
        } else {
          finishAttempt(false);
        }
      }, 900);
    }
    function renderWrongAnswer() {
      const question = state._wrongQuestion;
      const given = state._wrongGiven;
      const a = state._aiExplain || { loading: false, response: '', error: '' };

      // Get the user's selected answer text
      let givenText = '';
      if (Array.isArray(given)) {
        givenText = given.map(gi => question.options[gi]).filter(Boolean).join(', ');
      } else if (given !== undefined && given !== null && given >= 0) {
        givenText = question.options[given];
      } else {
        givenText = '(No answer - time ran out)';
      }

      // Get correct answer text
      let correctText = '';
      if (Array.isArray(question.correct)) {
        correctText = question.correct.map(ci => question.options[ci]).filter(Boolean).join(', ');
      } else if (question.correct !== undefined && question.correct !== null) {
        correctText = question.options[question.correct];
      }

      // Get per-option explanation for the selected answer
      let givenExplanation = '';
      const explanations = question.optionExplanations || [];
      if (Array.isArray(given)) {
        givenExplanation = given.map(gi => explanations[gi] || '').filter(Boolean).join(' ');
      } else if (given !== undefined && given !== null && given >= 0 && explanations[given]) {
        givenExplanation = explanations[given];
      }

      let aiArea;
      if (a.loading) {
        aiArea = `<div class="center-loading" style="padding:22px 10px;"><div class="spinner"></div>AI is preparing your detailed explanation…</div>`;
      } else if (a.error) {
        aiArea = `<div class="error-box">${escapeHtml(a.error)}</div><button class="btn btn-gold btn-sm" style="margin-top:10px;" onclick="aiExplainQuestion()">Try again</button>`;
      } else if (a.response) {
        aiArea = `<div class="ai-answer"><div class="ai-answer-head"><span class="icon-3d">&#129302;</span> AI Explainer</div><div class="academy-text">${escapeHtml(a.response)}</div></div>`;
      } else {
        aiArea = `<button class="btn btn-gold" onclick="aiExplainQuestion()">&#129302; Ask AI to explain this</button>`;
      }

      app.innerHTML = `
    <div class="wrap narrow" style="padding-top:14px;">
      <div class="card">
        <div class="proctor-gate">
          <div class="seal"><span class="icon-3d">&#128737;</span></div>
          <h2 style="margin-bottom:4px;">Incorrect Answer - Explanation Required</h2>
          <p style="color:var(--ink-600);font-size:13.5px;margin-top:4px;">Your answer was incorrect. Please read the explanation below before proceeding.</p>
          <div style="margin:18px 0;padding:12px 14px;background:var(--paper-dim);border-radius:8px;">
            <h4 style="margin:0 0 8px;color:var(--navy-950);">Your Selected Answer</h4>
            <div class="hint">${escapeHtml(givenText)}</div>
            ${givenExplanation ? `<div class="academy-text" style="font-size:13px;line-height:1.6;margin-top:8px;color:var(--ink-600);">${escapeHtml(givenExplanation)}</div>` : ''}
          </div>
          <div style="margin:18px 0;padding:12px 14px;background:var(--ok-100);border-left:4px solid var(--ok-600);border-radius:8px;">
            <h4 style="margin:0 0 8px;color:var(--ok-600);">Question Explanation</h4>
            <div class="academy-text" style="font-size:14px;line-height:1.7;">${escapeHtml(state._wrongQuestion.description || 'No explanation provided.')}</div>
          </div>
          <div style="margin:18px 0;padding:12px 14px;background:var(--bad-100);border-radius:8px;">
            <h4 style="margin:0 0 8px;color:var(--bad-600);">Correct Answer</h4>
            <div class="hint">${escapeHtml(correctText)}</div>
          </div>
          <div style="margin:18px 0;padding:14px;border:1px dashed var(--gold-500);border-radius:10px;background:#FFF9EE;">
            <h4 style="margin:0 0 10px;color:#8A6416;">Need a deeper explanation?</h4>
            ${aiArea}
          </div>
          <p style="color:var(--ink-600);font-size:13px;margin-top:16px;">After reading the explanation, click Continue to provide feedback or proceed to the next question.</p>
          <button class="btn btn-navy btn-block" onclick="proceedAfterWrongAnswer()">Continue</button>
        </div>
      </div>
    </div>
  `;
    }

    function stopQuizAndShowExplanation(question, given) {
      stopTimer();
      stopPoll();
      state._locked = true;
      state._wrongQuestion = question;
      state._wrongGiven = given;
      state._aiExplain = { loading: false, response: '', error: '' };
      renderWrongAnswer();
      // Auto-trigger AI explainer
      setTimeout(() => aiExplainQuestion(), 100);
    }

    async function aiExplainQuestion() {
      const q = state._wrongQuestion;
      const given = state._wrongGiven;
      if (!q) { return; }

      let givenText = '';
      if (Array.isArray(given)) {
        givenText = given.map(gi => 'Option ' + String.fromCharCode(65 + gi) + ': ' + q.options[gi]).filter(Boolean).join('; ');
      } else if (given !== undefined && given !== null && given >= 0) {
        givenText = 'Option ' + String.fromCharCode(65 + given) + ': ' + q.options[given];
      } else {
        givenText = '(No answer - time ran out)';
      }

      let correctText = '';
      if (Array.isArray(q.correct)) {
        correctText = q.correct.map(ci => 'Option ' + String.fromCharCode(65 + ci) + ': ' + q.options[ci]).filter(Boolean).join('; ');
      } else if (q.correct !== undefined && q.correct !== null) {
        correctText = 'Option ' + String.fromCharCode(65 + q.correct) + ': ' + q.options[q.correct];
      }

      const optionsBlock = q.options.map((o, i) => String.fromCharCode(65 + i) + ') ' + o).join('\n');

      const userPrompt = `A compliance assessment question was answered incorrectly. Explain it in full for the learner. Today's date is 2026-07-13.\n\nQUESTION:\n${q.text}\n\nOPTIONS:\n${optionsBlock}\n\nTHE TEAM MEMBER SELECTED: ${givenText}\nTHE CORRECT ANSWER IS: ${correctText}\n\nRespond in this exact structure:\n1) What the question is asking — explain the underlying topic/concept in detail and why it matters in real compliance work, referencing current practices and regulations (FATF, FCA, NCA) effective as of 2026.\n2) Why the selected answer is wrong — explain specifically why the chosen option(s) are incorrect, using relevant examples and regulatory context.\n3) Why the correct answer is right — explain in full why the correct option(s) are correct, referencing the relevant rule, legal framework (FATF, FCA, NCA), or a practical current-day example.`;

      state._aiExplain = { loading: true, response: '', error: '' };
      renderWrongAnswer();
      try {
        const answer = await aiTrainerAsk(userPrompt, 'en', AI_EXPLAINER_SYSTEM);
        state._aiExplain = { loading: false, response: answer, error: '' };
        renderWrongAnswer();
      } catch (e) {
        state._aiExplain = { loading: false, response: '', error: (e && e.message) ? e.message : 'Something went wrong contacting the AI.' };
        renderWrongAnswer();
      }
    }

    async function finishAttempt(flagged) {
      detachProctoring();
      const quiz = state.takingQuiz;
      const attempt = state.attempt;
      attempt.finishedAt = Date.now();
      attempt.durationMs = attempt.finishedAt - attempt.startedAt;
      attempt.score = quiz.questions.reduce((sum, q, i) => sum + (attempt.perQuestion[i] && attempt.perQuestion[i].correct ? q.points : 0), 0);
      attempt.flagged = !!flagged;

      app.innerHTML = `<div class="center-loading"><div class="spinner"></div>Submitting your answers…</div>`;

      const attemptId = genId(8);
      await sSet('attempt:' + quiz.id + ':' + attemptId, normalizeAttemptData(attempt));
      const idx = (await sGet('attempts-index:' + quiz.id)) || [];
      idx.push(attemptId);
      await sSet('attempts-index:' + quiz.id, idx);

      const totalPoints = quiz.questions.reduce((s, q) => s + q.points, 0);
      const pct = Math.round(attempt.score / totalPoints * 100);
      const userAttempts = (await sGet('user-attempts:' + state.user.uid)) || [];
      userAttempts.push({ quizId: quiz.id, quizTitle: quiz.title, attemptId, score: attempt.score, totalPoints, pct, passed: pct >= quiz.passPercent, at: Date.now(), isRetake: !!attempt.isRetake, isPostExpiryUnlock: !!attempt.isPostExpiryUnlock });
      await sSet('user-attempts:' + state.user.uid, userAttempts);

      state.lastResult = attempt;
      goto('p-result');
    }

    /* =========================================================
       PARTICIPANT — RESULT
    ========================================================= */
    function renderParticipantResult() {
      const quiz = state.takingQuiz;
      const attempt = state.lastResult;
      const totalPoints = quiz.questions.reduce((s, q) => s + q.points, 0);
      const pct = Math.round(attempt.score / totalPoints * 100);
      const passed = pct >= quiz.passPercent;
      const ringColor = passed ? 'var(--ok-600)' : 'var(--bad-600)';
      const violations = attempt.violations || [];

      app.innerHTML = `
    <div class="wrap narrow" style="padding-top:10px;">
      <div class="score-hero">
        <div class="score-ring icon-3d-pop" style="background:conic-gradient(${ringColor} ${pct * 3.6}deg, var(--paper-dim) 0deg);">
          <div style="width:118px;height:118px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;">
            <div class="val">${pct}%</div>
          </div>
        </div>
        <div class="status-badge ${passed ? 'pass' : 'fail'} icon-3d-pop" style="animation-delay:.15s;">${passed ? '&#10003; Passed' : '&#8635; Needs Retake'}</div>
        <h2 style="margin:14px 0 4px;">${escapeHtml(attempt.name)}, here's your result</h2>
        <p style="color:var(--ink-600);font-size:14px;">${attempt.score} / ${totalPoints} points &middot; ${quiz.questions.length} questions &middot; ${formatDurationLabel(attempt.durationMs)} total</p>
        ${attempt.flagged ? `<p style="color:var(--bad-600);font-size:12.5px;">This attempt was auto-submitted due to repeated integrity warnings.</p>` : ''}
        ${!attempt.flagged && violations.length > 0 ? `<p style="color:var(--bad-600);font-size:12.5px;">&#9888; ${violations.length} integrity flag(s) were recorded and are visible to your Admin.</p>` : ''}
      </div>

      <h3 style="font-size:15px;margin:30px 0 14px;color:var(--navy-950);">Answer Review</h3>
      ${quiz.questions.map((q, i) => {
        const pq = attempt.perQuestion[i];
        const givenText = formatGivenAnswer(q, pq && pq.given);
        return `
          <div class="review-item">
            <div class="rq">Q${i + 1}. ${escapeHtml(q.text)}</div>
            <div class="ra ${pq && pq.correct ? 'given-right' : 'given-wrong'}">Your answer: ${escapeHtml(givenText)}</div>
            ${!(pq && pq.correct) ? `<div class="ra correct-hint">Correct answer: ${escapeHtml(formatCorrectAnswer(q))}</div>` : ''}
          </div>
        `;
      }).join('')}

      ${!passed ? `<button class="btn btn-gold btn-block" style="margin-top:10px;" onclick="retakeAssessment()">Retake Assessment</button>` : ''}
      ${feedbackFormHtml('quiz', quiz.id)}
      <button class="btn ${passed ? 'btn-navy' : 'btn-secondary'} btn-block" style="margin-top:16px;" onclick="goto('member-home')">Done</button>
    </div>
  `;
    }
    function formatGivenAnswer(q, given) {
      if (given === undefined || given === null) return '(No answer — time ran out)';
      const parsed = parseStoredAnswer(given);
      if (Array.isArray(parsed)) {
        if (parsed.length === 0) return '(No answer — time ran out)';
        return parsed.map(gi => q.options[gi]).join(', ');
      }
      if (parsed < 0) return '(No answer — time ran out)';
      return q.options[parsed];
    }
    function formatCorrectAnswer(q) {
      if (Array.isArray(q.correct)) return q.correct.map(ci => q.options[ci]).join(', ');
      return q.options[q.correct];
    }
    async function retakeAssessment() {
      const quiz = state.takingQuiz;
      await startAssessmentFlow(quiz);
    }

    console.log('%cRemit Union AML Academy Portal — Build: ' + BUILD_STAMP, 'font-weight:bold;font-size:14px;color:#007F90;');
    initTheme();
    if (!FIREBASE_CONFIGURED) {
      app.innerHTML = `
    <div class="wrap narrow" style="padding-top:30px;">
      <div class="card">
        <h2 style="margin-top:0;">Setup needed</h2>
        <p style="color:var(--ink-600);font-size:14px;">Paste your Firebase config into the script near the top of this file.</p>
      </div>
    </div>
  `;
    } else {
      render();
      initAuthListener();
    }
  </script>
</body>

</html>

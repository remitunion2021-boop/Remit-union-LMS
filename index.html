<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remit Union AML Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --navy-950: #0A1F23;
      --navy-900: #0E2A30;
      --navy-800: #15414A;
      --blue-700: #106572;
      --blue-500: #007F90;
      --gold-500: #00A9BF;
      --gold-400: #3FC6D9;
      --paper: #F5F9F9;
      --paper-dim: #E7EFEF;
      --ink-900: #0C1526;
      --ink-600: #4B5568;
      --ink-400: #8A93A6;
      --line: #DCE5E5;
      --ok-600: #1F8A5F;
      --ok-100: #E4F5EC;
      --bad-600: #C23B3B;
      --bad-100: #FBE9E9;
      --white: #FFFFFF;
      --radius: 14px;
      --shadow-sm: 0 1px 2px rgba(10, 31, 35, 0.06), 0 1px 1px rgba(10, 31, 35, 0.04);
      --shadow-md: 0 8px 24px rgba(10, 31, 35, 0.10);
      --shadow-lg: 0 20px 50px rgba(10, 31, 35, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink-900);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    h3,
    .display {
      font-family: 'Sora', system-ui, sans-serif;
    }

    .mono {
      font-family: 'JetBrains Mono', monospace;
    }

    .hidden {
      display: none !important;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    input,
    select,
    textarea {
      font-family: inherit;
    }

    a {
      color: inherit;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      min-height: 64px;
      background: var(--navy-950);
      color: var(--white);
      border-bottom: 3px solid var(--gold-500);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      flex-shrink: 0;
      display: block;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .15);
    }

    .brand-text {
      line-height: 1.15;
      min-width: 0;
    }

    .brand-text .t1 {
      font-family: 'Sora';
      font-weight: 700;
      font-size: 14px;
      letter-spacing: .2px;
    }

    .brand-text .t2 {
      font-size: 10px;
      color: #9FB0CC;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .who {
      font-size: 13px;
      color: #B9C6DD;
    }

    .who b {
      color: #fff;
    }

    .linkbtn {
      background: none;
      border: 1px solid rgba(255, 255, 255, .25);
      color: #fff;
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
    }

    .linkbtn:hover {
      background: rgba(255, 255, 255, .08);
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .10);
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
    }

    .user-chip .av,
    .user-chip .avatar-image {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--gold-500);
      color: var(--navy-950);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
      object-fit: cover;
    }

    .user-chip .avatar-image {
      border: 2px solid rgba(255, 255, 255, .22);
    }

    /* ---------- Layout ---------- */
    .wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    .wrap.narrow {
      max-width: 640px;
    }

    /* ---------- Landing / hero ---------- */
    .hero {
      text-align: center;
      padding: 44px 20px 30px;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #FFFFFF;
      background: #000000;
      padding: 7px 16px;
      border-radius: 100px;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 38px;
      font-weight: 800;
      color: var(--navy-950);
      margin: 0 0 10px;
      line-height: 1.12;
      letter-spacing: -.5px;
    }

    .hero p {
      font-size: 15px;
      color: var(--ink-600);
      max-width: 520px;
      margin: 0 auto 10px;
      line-height: 1.6;
    }

    @media(max-width:640px) {
      .hero h1 {
        font-size: 28px;
      }
    }

    /* ---------- Cards / generic ---------- */
    .card {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: var(--shadow-sm);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .section-head h2 {
      font-size: 22px;
      margin: 0;
      color: var(--navy-950);
    }

    .section-head .sub {
      font-size: 13px;
      color: var(--ink-600);
      margin-top: 4px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-600);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 7px;
    }

    .field input[type=text],
    .field input[type=number],
    .field input[type=email],
    .field input[type=password],
    .field textarea,
    .field select {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      font-size: 14.5px;
      color: var(--ink-900);
      background: var(--paper);
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      outline: none;
      border-color: var(--blue-500);
      background: #fff;
    }

    .field textarea {
      resize: vertical;
      min-height: 60px;
    }

    .hint {
      font-size: 12px;
      color: var(--ink-400);
      margin-top: 6px;
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .row3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
    }

    @media(max-width:560px) {

      .row2,
      .row3 {
        grid-template-columns: 1fr;
      }
    }

    .btn {
      padding: 11px 20px;
      border-radius: 9px;
      border: none;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-primary {
      background: var(--navy-950);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--navy-800);
    }

    .btn-secondary {
      background: var(--paper-dim);
      color: var(--navy-950);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: #DFE3EC;
    }

    .btn-danger {
      background: var(--bad-100);
      color: var(--bad-600);
    }

    .btn-danger:hover {
      background: #F6D5D5;
    }

    .btn-block {
      width: 100%;
    }

    .btn-sm {
      padding: 7px 13px;
      font-size: 12.5px;
      border-radius: 7px;
    }

    .btn[disabled] {
      opacity: .5;
      cursor: not-allowed;
    }

    .btn-navy {
      background: var(--navy-950);
      color: #fff;
    }

    .btn-navy:hover {
      background: var(--navy-800);
    }

    .btn-gold {
      background: var(--gold-500);
      color: var(--navy-950);
    }

    .btn-gold:hover {
      background: var(--gold-400);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-600);
      font-size: 13px;
      font-weight: 600;
      background: none;
      border: none;
      margin-bottom: 18px;
      padding: 0;
    }

    .back-link:hover {
      color: var(--navy-950);
    }

    /* ---------- Auth ---------- */
    .auth-tabs {
      display: flex;
      gap: 6px;
      background: var(--paper-dim);
      padding: 5px;
      border-radius: 11px;
      margin-bottom: 22px;
    }

    .auth-tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      border: none;
      background: none;
      font-weight: 700;
      font-size: 13.5px;
      color: var(--ink-600);
    }

    .auth-tab.active {
      background: #fff;
      color: var(--navy-950);
      box-shadow: var(--shadow-sm);
    }

    .error-box {
      background: var(--bad-100);
      color: var(--bad-600);
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 13px;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .role-choice {
      display: flex;
      gap: 10px;
    }

    .role-choice label {
      flex: 1;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 12px 10px;
      text-align: center;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink-600);
      display: block;
    }

    .role-choice input {
      margin-right: 6px;
      accent-color: var(--navy-950);
    }

    .pending-banner {
      background: #FFF6E5;
      border: 1px solid var(--gold-500);
      color: #8A6416;
      padding: 14px 18px;
      border-radius: 12px;
      margin-bottom: 22px;
      font-size: 13.5px;
      line-height: 1.55;
    }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap input {
      padding-right: 70px !important;
    }

    .pw-toggle {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--paper-dim);
      border: none;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-600);
    }

    .pw-toggle:hover {
      background: var(--line);
    }

    /* ---------- Role pills ---------- */
    .role-pill {
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .4px;
      white-space: nowrap;
    }

    .role-pill.admin {
      background: var(--gold-500);
      color: var(--navy-950);
    }

    .role-pill.subadmin {
      background: var(--blue-500);
      color: #fff;
    }

    .role-pill.member {
      background: var(--paper-dim);
      color: var(--ink-600);
    }

    /* ---------- Dashboard list ---------- */
    .quiz-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
      flex-wrap: wrap;
    }

    .quiz-row:hover {
      border-color: var(--blue-500);
    }

    .quiz-row .qi h4 {
      margin: 0 0 5px;
      font-size: 15.5px;
      color: var(--navy-950);
    }

    .quiz-row .qi .meta {
      font-size: 12.5px;
      color: var(--ink-400);
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .code-chip {
      font-family: 'JetBrains Mono';
      font-weight: 700;
      letter-spacing: 2px;
      background: var(--navy-950);
      color: var(--gold-400);
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 12.5px;
    }

    .qi-actions {
      display: flex;
      gap: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--ink-400);
    }

    .empty-state .em-icon {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .empty-state h4 {
      color: var(--ink-600);
      margin: 0 0 6px;
      font-size: 15px;
    }

    /* ---------- Pending requests / directory ---------- */
    .req-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 11px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .req-row .ri .n {
      font-weight: 700;
      font-size: 14px;
      color: var(--navy-950);
    }

    .req-row .ri .m {
      font-size: 12px;
      color: var(--ink-400);
      margin-top: 2px;
    }

    table.people {
      width: 100%;
      border-collapse: collapse;
    }

    table.people th {
      text-align: left;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .4px;
      color: var(--ink-400);
      padding: 9px 10px;
      border-bottom: 2px solid var(--line);
    }

    table.people td {
      padding: 11px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px;
      vertical-align: middle;
    }

    /* ---------- Question builder ---------- */
    .q-block {
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      background: var(--paper);
      position: relative;
    }

    .q-block .q-num {
      position: absolute;
      top: -11px;
      left: 16px;
      background: var(--navy-950);
      color: var(--gold-400);
      font-family: 'JetBrains Mono';
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 100px;
    }

    .opt-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }

    .opt-row input[type=radio] {
      width: 18px;
      height: 18px;
      accent-color: var(--ok-600);
      flex-shrink: 0;
    }

    .opt-row input[type=text] {
      flex: 1;
    }

    .q-remove {
      position: absolute;
      top: 14px;
      right: 14px;
      background: none;
      border: none;
      color: var(--ink-400);
      font-size: 13px;
      font-weight: 700;
    }

    .q-remove:hover {
      color: var(--bad-600);
    }

    /* ---------- Proctoring / join / quiz taking ---------- */
    .seal {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--gold-400), var(--gold-500));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 26px rgba(201, 150, 44, .35);
      border: 4px solid var(--navy-950);
    }

    .seal span {
      font-size: 32px;
    }

    .proctor-gate {
      text-align: center;
      padding: 6px;
    }

    .proctor-gate ul {
      text-align: left;
      font-size: 13.5px;
      color: var(--ink-600);
      line-height: 1.85;
      max-width: 440px;
      margin: 16px auto 22px;
      padding-left: 20px;
    }

    .progress-wrap {
      margin-bottom: 26px;
    }

    .progress-bar {
      height: 8px;
      background: var(--paper-dim);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue-500), var(--gold-500));
      transition: width .3s ease;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--ink-400);
      margin-top: 7px;
      font-weight: 600;
    }

    .timer-ring {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy-950);
      color: #fff;
      font-family: 'JetBrains Mono';
      font-weight: 700;
      font-size: 17px;
      flex-shrink: 0;
      border: 3px solid var(--gold-500);
    }

    .timer-ring.low {
      border-color: var(--bad-600);
      color: var(--bad-600);
      background: var(--bad-100);
    }

    .q-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    .q-text {
      font-size: 21px;
      font-weight: 700;
      color: var(--navy-950);
      line-height: 1.4;
      font-family: 'Sora';
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media(max-width:560px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .opt-btn {
      text-align: left;
      padding: 18px 18px;
      border-radius: 12px;
      border: 2px solid var(--line);
      background: #fff;
      font-size: 15px;
      font-weight: 600;
      color: var(--ink-900);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all .12s ease;
    }

    .opt-btn:hover {
      border-color: var(--blue-500);
      background: #F3F7FD;
    }

    .opt-btn .tag {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--paper-dim);
      color: var(--ink-600);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .opt-btn.selected {
      border-color: var(--navy-950);
      background: var(--navy-950);
      color: #fff;
    }

    .opt-btn.selected .tag {
      background: var(--gold-500);
      color: var(--navy-950);
    }

    .opt-btn.correct {
      border-color: var(--ok-600);
      background: var(--ok-100);
    }

    .opt-btn.correct .tag {
      background: var(--ok-600);
      color: #fff;
    }

    .opt-btn.wrong {
      border-color: var(--bad-600);
      background: var(--bad-100);
    }

    .opt-btn.wrong .tag {
      background: var(--bad-600);
      color: #fff;
    }

    .opt-btn[disabled] {
      cursor: default;
    }

    .no-select {
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
    }

    /* ---------- Result summary ---------- */
    .score-hero {
      text-align: center;
      padding: 20px 20px 8px;
    }

    .score-ring {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: 0 auto 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .score-ring .val {
      font-family: 'Sora';
      font-weight: 800;
      font-size: 34px;
      color: var(--navy-950);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 18px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 13.5px;
      margin-bottom: 6px;
    }

    .status-badge.pass {
      background: var(--ok-100);
      color: var(--ok-600);
    }

    .status-badge.fail {
      background: var(--bad-100);
      color: var(--bad-600);
    }

    .review-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
    }

    .review-item .rq {
      font-weight: 700;
      font-size: 14.5px;
      color: var(--navy-950);
      margin-bottom: 10px;
    }

    .review-item .ra {
      font-size: 13.5px;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 6px;
    }

    .ra.given-wrong {
      background: var(--bad-100);
      color: var(--bad-600);
    }

    .ra.given-right {
      background: var(--ok-100);
      color: var(--ok-600);
    }

    .ra.correct-hint {
      background: var(--paper-dim);
      color: var(--ink-600);
    }

    /* ---------- Table ---------- */
    table.lb {
      width: 100%;
      border-collapse: collapse;
    }

    table.lb th {
      text-align: left;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--ink-400);
      padding: 10px 12px;
      border-bottom: 2px solid var(--line);
    }

    table.lb td {
      padding: 13px 12px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      vertical-align: middle;
    }

    table.lb tr:last-child td {
      border-bottom: none;
    }

    .rank-pill {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: var(--paper-dim);
      color: var(--ink-600);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
    }

    .rank-pill.top {
      background: var(--gold-500);
      color: var(--navy-950);
    }

    .pill {
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .pill.pass {
      background: var(--ok-100);
      color: var(--ok-600);
    }

    .pill.fail {
      background: var(--bad-100);
      color: var(--bad-600);
    }

    .integrity-pill {
      padding: 3px 9px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .integrity-pill.clean {
      background: var(--ok-100);
      color: var(--ok-600);
    }

    .integrity-pill.warn {
      background: #FFF3D6;
      color: #8A6416;
    }

    .integrity-pill.high {
      background: var(--bad-100);
      color: var(--bad-600);
    }

    details>summary {
      list-style: none;
    }

    details>summary::-webkit-details-marker {
      display: none;
    }

    .viol-log {
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--ink-600);
      background: var(--paper);
      padding: 8px 10px;
      border-radius: 8px;
      line-height: 1.7;
    }

    /* stat cards */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 28px;
    }

    @media(max-width:700px) {
      .stat-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
    }

    .stat-card .sv {
      font-family: 'Sora';
      font-weight: 800;
      font-size: 24px;
      color: var(--navy-950);
    }

    .stat-card .sl {
      font-size: 11.5px;
      color: var(--ink-400);
      text-transform: uppercase;
      letter-spacing: .4px;
      margin-top: 4px;
    }

    /* code display for created quiz */
    .code-display {
      text-align: center;
      padding: 34px 20px;
      background: var(--navy-950);
      border-radius: 16px;
      color: #fff;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    .code-display .lbl {
      font-size: 11.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-400);
      margin-bottom: 10px;
      position: relative;
    }

    .code-display .code {
      font-family: 'JetBrains Mono';
      font-size: 40px;
      font-weight: 700;
      letter-spacing: 10px;
      position: relative;
    }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--navy-950);
      color: #fff;
      padding: 13px 22px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: all .25s ease;
      z-index: 999;
      max-width: 90vw;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error {
      background: var(--bad-600);
    }

    .toast.success {
      background: var(--ok-600);
    }

    .violation-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: var(--bad-600);
      color: #fff;
      text-align: center;
      padding: 11px;
      font-weight: 700;
      font-size: 13px;
      z-index: 998;
      transform: translateY(-120%);
      transition: transform .3s ease;
    }

    .violation-banner.show {
      transform: translateY(0);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, .25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .center-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: var(--ink-400);
      gap: 14px;
    }

    .center-loading .spinner {
      border-color: var(--line);
      border-top-color: var(--blue-500);
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--ink-400);
      margin-top: 36px;
      line-height: 1.6;
    }

    /* ---------- Training Academy ---------- */
    .academy-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--white);
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .academy-row:hover {
      border-color: var(--blue-500);
    }

    .type-pill {
      padding: 3px 9px;
      border-radius: 100px;
      font-size: 10.5px;
      font-weight: 700;
      background: var(--paper-dim);
      color: var(--ink-600);
      text-transform: uppercase;
    }

    .toggle-pills {
      display: inline-flex;
      background: var(--paper-dim);
      padding: 4px;
      border-radius: 10px;
      gap: 4px;
    }

    .toggle-pill {
      padding: 8px 16px;
      border-radius: 7px;
      border: none;
      background: none;
      font-weight: 700;
      font-size: 13px;
      color: var(--ink-600);
    }

    .toggle-pill.active {
      background: #fff;
      color: var(--navy-950);
      box-shadow: var(--shadow-sm);
    }

    .academy-content {
      min-height: 220px;
      padding: 8px 2px;
    }

    .academy-content img {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: var(--shadow-md);
      display: block;
      margin: 0 auto;
    }

    .academy-text {
      font-size: 15px;
      line-height: 1.75;
      color: var(--ink-900);
      white-space: pre-wrap;
    }

    .listen-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-radius: 9px;
      border: 1.5px solid var(--gold-500);
      background: #FFF9EE;
      color: #8A6416;
      font-weight: 700;
      font-size: 13px;
    }

    .listen-btn.playing {
      background: var(--gold-500);
      color: var(--navy-950);
    }

    .page-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 22px;
    }

    .progress-bar-inline {
      flex: 1;
      height: 6px;
      background: var(--paper-dim);
      border-radius: 100px;
      overflow: hidden;
    }

    .upload-progress {
      text-align: center;
      padding: 40px 20px;
    }

    .upload-progress .pct {
      font-family: 'Sora';
      font-weight: 800;
      font-size: 28px;
      color: var(--navy-950);
      margin: 14px 0 6px;
    }

    /* ---------- Admin sidebar shell ---------- */
    .admin-shell {
      display: flex;
      gap: 0;
      align-items: flex-start;
      max-width: 1080px;
      margin: 0 auto;
    }

    .admin-sidebar {
      width: 210px;
      flex-shrink: 0;
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-right: 22px;
      border-right: 1px solid var(--line);
    }

    .side-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ink-400);
      padding: 0 12px 10px;
    }

    .side-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      border-radius: 9px;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink-600);
      text-align: left;
      width: 100%;
    }

    .side-link:hover {
      background: var(--paper-dim);
    }

    .side-link.active {
      background: var(--navy-950);
      color: #fff;
    }

    .side-link .ic {
      font-size: 16px;
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .side-badge {
      margin-left: auto;
      background: var(--bad-600);
      color: #fff;
      font-size: 10.5px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 100px;
    }

    .admin-main {
      flex: 1;
      min-width: 0;
      padding-left: 28px;
    }

    @media(max-width:800px) {
      .admin-shell {
        flex-direction: column;
      }

      .admin-sidebar {
        width: 100%;
        position: static;
        flex-direction: row;
        overflow-x: auto;
        border-right: none;
        border-bottom: 1px solid var(--line);
        padding: 0 0 14px;
        margin-bottom: 18px;
      }

      .admin-main {
        padding-left: 0;
      }
    }

    .dept-tag {
      background: var(--paper-dim);
      color: var(--ink-600);
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 100px;
    }

    .feedback-box {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      margin-top: 20px;
    }

    .feedback-item {
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }

    .feedback-item .fi-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .feedback-item .fi-name {
      font-weight: 700;
      font-size: 13.5px;
      color: var(--navy-950);
    }

    .feedback-item .fi-meta {
      font-size: 11.5px;
      color: var(--ink-400);
    }

    .feedback-item .fi-text {
      font-size: 13.5px;
      color: var(--ink-900);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    /* ---------- Lightweight CSS-only 3D icon animations (no libraries, works everywhere) ---------- */
    @keyframes float3d {

      0%,
      100% {
        transform: perspective(600px) rotateY(0deg) rotateX(0deg) translateY(0px);
      }

      25% {
        transform: perspective(600px) rotateY(10deg) rotateX(3deg) translateY(-7px);
      }

      50% {
        transform: perspective(600px) rotateY(0deg) rotateX(0deg) translateY(0px);
      }

      75% {
        transform: perspective(600px) rotateY(-10deg) rotateX(-3deg) translateY(-7px);
      }
    }

    .icon-3d {
      display: inline-block;
      animation: float3d 4.5s ease-in-out infinite;
      transform-style: preserve-3d;
      will-change: transform;
    }

    @keyframes pop3d {
      0% {
        transform: perspective(700px) rotateX(-70deg) scale(.4);
        opacity: 0;
      }

      60% {
        transform: perspective(700px) rotateX(12deg) scale(1.08);
        opacity: 1;
      }

      100% {
        transform: perspective(700px) rotateX(0deg) scale(1);
        opacity: 1;
      }
    }

    .icon-3d-pop {
      display: inline-block;
      animation: pop3d .65s cubic-bezier(.34, 1.56, .64, 1) both;
    }

    @keyframes spin3d {
      0% {
        transform: perspective(600px) rotateY(0deg);
      }

      100% {
        transform: perspective(600px) rotateY(360deg);
      }
    }

    .icon-3d-spin {
      display: inline-block;
      animation: spin3d 3s linear infinite;
      transform-style: preserve-3d;
    }

    /* ---------- Instant page transitions (no slow load flash) ---------- */
    @keyframes pageIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(.992);
      }

      100% {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    #app.page-enter {
      animation: pageIn .26s cubic-bezier(.22, .61, .36, 1);
    }

    .card,
    .quiz-row,
    .academy-row,
    .req-row,
    .stat-card {
      animation: fadeIn .3s ease both;
    }

    /* Lighter, smaller, faster loading so it never feels stuck */
    .center-loading {
      padding: 26px 20px;
    }

    .center-loading .spinner {
      width: 20px;
      height: 20px;
      border-width: 2px;
    }

    /* Skeleton shimmer for instant-feel loads */
    .skeleton {
      background: linear-gradient(90deg, var(--paper) 25%, var(--paper-dim) 37%, var(--paper) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.1s ease infinite;
      border-radius: 9px;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: -100% 0;
      }
    }

    /* Reduced-motion respect */
    @media (prefers-reduced-motion:reduce) {

      #app.page-enter,
      .card,
      .quiz-row,
      .academy-row,
      .req-row,
      .stat-card {
        animation: none !important;
      }
    }
  </style>
</head>

  <script src="app.js"></script>
  <script>
    /* =========================================================
       STORAGE HELPERS (Firebase Firestore — generic key/value)
    ========================================================= */
    async function sGet(key) {
      try {
        const doc = await db.collection('quizData').doc(key).get();
        return doc.exists ? doc.data().value : null;
      } catch (e) { console.error('sGet error', e); return null; }
    }
    async function sSet(key, value) {
      try {
        await db.collection('quizData').doc(key).set({ value: value });
        return true;
      } catch (e) { console.error('sSet error', e); return false; }
    }
    async function sDelete(key) {
      try {
        await db.collection('quizData').doc(key).delete();
        return true;
      } catch (e) { console.error('sDelete error', e); return false; }
    }

    /* =========================================================
       UTILITIES
    ========================================================= */
    function genId(len) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let s = '';
      for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * chars.length)];
      return s;
    }
    function escapeHtml(s) {
      if (s === undefined || s === null) return '';
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (type ? ' ' + type : '');
      clearTimeout(t._h);
      t._h = setTimeout(() => { t.className = 'toast'; }, 2800);
    }
    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }
    function buildShuffledQuiz(quiz) {
      const shuffledQuestions = shuffleArray(quiz.questions).map(q => {
        const indices = q.options.map((_, idx) => idx);
        const optionOrder = shuffleArray(indices); // new position -> old index
        const newOptions = optionOrder.map(oldIdx => q.options[oldIdx]);
        const newOptionExplanations = optionOrder.map(oldIdx => (q.optionExplanations || [])[oldIdx] || '');
        const newCorrect = q.type === 'multi'
          ? (Array.isArray(q.correct) ? q.correct : [q.correct]).map(oldIdx => optionOrder.indexOf(oldIdx))
          : optionOrder.indexOf(q.correct);
        return {
          text: q.text, points: q.points, type: q.type, timeLimit: q.timeLimit,
          options: newOptions, correct: newCorrect,
          description: q.description || '',
          optionExplanations: newOptionExplanations
        };
      });
      return { ...quiz, questions: shuffledQuestions };
    }
    function friendlyViolation(type) {
      return ({ tab_hidden: 'Tab switched away', window_blur: 'Window lost focus', fullscreen_exit: 'Exited full-screen' })[type] || 'Activity flagged';
    }
    function buildLocalExplanation(text, title, language) {
      const baseText = (text || '').replace(/\s+/g, ' ').trim();
      const topic = (title || 'this training topic').trim();
      if (language === 'ur') {
        return `یہ حصہ ${topic} سے متعلق ہے۔ اس میں بنیادی اصول، عملی اہداف اور ٹیم کے ارکان پر پڑنے والے اثرات واضح کیے گئے ہیں۔ صارف کو اس موضوع کی بنیاد سمجھنی چاہیے اور متعلقہ ضابطوں کے مطابق عمل کرنا چاہیے۔${baseText ? ` ماخذ میں یہ اہم نقطہ شامل تھا: ${baseText.slice(0, 180)}` : ''}`;
      }
      return `This section explains ${topic} in simple terms. It highlights the main rule, why it matters in real compliance work, and the practical steps a team member should follow. ${baseText ? `The source material points to: ${baseText.slice(0, 180)}` : 'The guidance is written to help the learner understand the topic clearly.'}`;
    }
    function normalizeAnswerValue(value) {
      if (Array.isArray(value)) return value.join('|');
      return value;
    }
    function normalizeAttemptData(attempt) {
      const cloned = JSON.parse(JSON.stringify(attempt));
      cloned.answers = (cloned.answers || []).map(normalizeAnswerValue);
      cloned.perQuestion = (cloned.perQuestion || []).map(item => ({
        ...item,
        given: normalizeAnswerValue(item && item.given)
      }));
      return cloned;
    }
    function parseStoredAnswer(given) {
      if (Array.isArray(given)) return given;
      if (typeof given === 'string') {
        if (given.startsWith('[')) { try { const parsed = JSON.parse(given); return Array.isArray(parsed) ? parsed : []; } catch (e) { } }
        if (given.includes('|')) return given.split('|').map(v => { const n = Number(v); return Number.isNaN(n) ? v : n; });
      }
      return given;
    }
    function applyTheme(theme) {
      const resolved = theme === 'dark' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', resolved);
      document.documentElement.setAttribute('data-theme', resolved);
      if (state) { state.theme = resolved; }
      try { localStorage.setItem('remitunion-theme', resolved); } catch (e) { }
    }
    function initTheme() {
      try {
        const saved = localStorage.getItem('remitunion-theme');
        applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      } catch (e) { applyTheme('light'); }
    }
    function toggleTheme() {
      applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    }

    /* =========================================================
       FEEDBACK / QUESTIONS — collected after assessments and after
       training-only completions (no linked assessment)
    ========================================================= */
    function feedbackFormHtml(contextType, contextId) {
      return `
    <div class="feedback-box">
      <h3 style="margin:0 0 6px;font-size:15px;">Any questions or feedback?</h3>
      <p class="hint" style="margin-bottom:12px;color:var(--navy-600);">Please provide mandatory feedback</p>
      <textarea id="feedbackText" placeholder="e.g. I wasn't sure about the SAR reporting timeline mentioned on page 3…" style="min-height:80px;"></textarea>
      <button class="btn btn-navy btn-sm" style="margin-top:10px;" onclick="submitFeedbackForm('${contextType}','${contextId}', this)">Submit Feedback</button>
      <span id="feedbackError" class="hint" style="display:none;margin-left:10px;color:var(--bad-600);font-weight:600;">Feedback is required</span>
      <span id="feedbackSentMsg" class="hint" style="display:none;margin-left:10px;color:var(--ok-600);font-weight:600;">Sent — thank you!</span>
    </div>
  `;
    }
    async function submitFeedbackForm(contextType, contextId, btn) {
      const text = document.getElementById('feedbackText').value.trim();
      const errEl = document.getElementById('feedbackError');
      if (!text) {
        if (errEl) errEl.style.display = 'inline';
        return;
      }
      if (errEl) errEl.style.display = 'none';
      btn.disabled = true;
      const fid = genId(8);
      const entry = {
        name: state.profile.name, uid: state.user.uid,
        department: state.profile.department, designation: state.profile.designation,
        text, at: Date.now()
      };
      await sSet(`feedback:${contextType}:${contextId}:${fid}`, entry);
      const idxKey = `feedback-index:${contextType}:${contextId}`;
      const idx = (await sGet(idxKey)) || [];
      idx.push(fid);
      await sSet(idxKey, idx);
      document.getElementById('feedbackText').style.display = 'none';
      btn.style.display = 'none';
      document.getElementById('feedbackSentMsg').style.display = 'inline';
    }

    async function openFeedbackView(contextType, contextId) {
      app.innerHTML = `<div class="center-loading"><div class="spinner"></div>Loading…</div>`;

      if (contextType === 'quiz') { const q = await sGet('quiz:' + contextId); title = q ? q.title : 'Assessment'; }
      else { const t = await sGet('training:' + contextId); title = t ? t.title : 'Training'; }

      user: null,
      profile: null,
      authTab: 'login',
      authError: '',
      activeQuiz: null,
      takingQuiz: null,
      attempt: null,
      qIndex: 0,
      timerInterval: null,
      timeLeft: 0,
      lastResult: null,
      pollInterval: null,
      _locked: false,
      theme: 'light',
    };

    function stopTimer() { if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; } }
    function stopPoll() { if (state.pollInterval) { clearInterval(state.pollInterval); state.pollInterval = null; } }

    function goto(screen) {
      stopPoll();
      state.screen = screen;
      render();
    }

    const app = document.getElementById('app');
    const topActions = document.getElementById('topActions');

    /* =========================================================
       AUTH
    ========================================================= */
    let signupInProgress = false;

    function initAuthListener() {
      firebase.auth().onAuthStateChanged(async (user) => {
        if (signupInProgress) return;
        state.user = user;
        if (user) {
          try {
            const doc = await db.collection('quizData').doc('user:' + user.uid).get();
            if (!doc.exists) {
              await firebase.auth().signOut();
              state.user = null; state.profile = null;
              state.authError = 'No profile found for this account — please sign up again. (Is account ka profile Firestore mein nahi mila.)';
              goto('auth');
              return;
            }
            state.profile = doc.data().value;
            startSessionTimer();
            routeAfterAuth();
          } catch (e) {
            console.error('Profile fetch error', e);
            state.user = null; state.profile = null;
            state.authError = 'Could not load your profile — this is usually a Firestore permissions problem. Raw error: ' + (e && e.message ? e.message : String(e)) + ' (Firestore rules check karein.)';
            goto('auth');
          }
        } else {
          state.profile = null;
          goto('auth');
        }
      });
    }

    // Auto logout after 1 hour of session time
    function startSessionTimer() {
      stopSessionTimer();
      // 1 hour = 60 minutes = 3600000 ms
      state._sessionTimer = setTimeout(() => {
        showToast('Session expired after 1 hour. You have been logged out for security. (1 ghanta guzar gaya - security ke liye logout ho gaye hain.)', 'error');
        logout();
      }, 3600000);

      // Also show warning after 50 minutes
      state._sessionWarnTimer = setTimeout(() => {
        showToast('Your session will expire in 10 minutes. (Aapka session 10 minute mein expire ho jayega.)', 'error');
      }, 3000000);
    }
    function stopSessionTimer() {
      if (state._sessionTimer) { clearTimeout(state._sessionTimer); state._sessionTimer = null; }
      if (state._sessionWarnTimer) { clearTimeout(state._sessionWarnTimer); state._sessionWarnTimer = null; }
    }
    function routeAfterAuth() {
      if (state.profile.role === 'admin' || state.profile.role === 'subadmin') {
        goto('admin-assessments');
      } else {
        goto('member-home');
      }
    }
    async function logout() {
      stopTimer(); stopPoll(); stopSessionTimer();
      await firebase.auth().signOut();
    }
    function goHomeDashboard() {
      if (state.screen === 'p-quiz' || state.screen === 'proctor-gate') return;
      if (!state.profile) return;
      routeAfterAuth();
    }
    function mapAuthError(e) {
      const code = e && e.code;
      const map = {
        'auth/email-already-in-use': 'This email is already registered — please use the Log In tab. (Yeh email pehle se registered hai — Log In tab use karein.)',
        'auth/invalid-email': 'That email format is not valid. (Email ka format sahi nahi hai.)',
        'auth/weak-password': 'Password must be at least 6 characters. (Password kam az kam 6 characters ka hona chahiye.)',
        'auth/user-not-found': 'Incorrect email or password. (Email ya password ghalat hai.)',
        'auth/wrong-password': 'Incorrect email or password. (Email ya password ghalat hai.)',
        'auth/invalid-credential': 'Incorrect email or password. (Email ya password ghalat hai.)',
        'auth/too-many-requests': 'Too many attempts — please try again later. (Bohat zyada koshishein — thori dair baad try karein.)',
        'auth/operation-not-allowed': 'Email/Password sign-in is not enabled in Firebase yet. Go to Authentication → Sign-in method → Email/Password → Enable. (Yeh Firebase console mein enable nahi hai.)',
        'auth/network-request-failed': 'Please check your internet connection. (Internet connection check karein.)'
      };
      return map[code] || ('Something went wrong: ' + (e && e.message ? e.message : 'please try again') + ' (Kuch masla hua, dobara koshish karein.)');
    }

    function switchAuthTab(tab) { state.authTab = tab; state.authError = ''; render(); }

    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      if (input.type === 'password') { input.type = 'text'; btn.textContent = 'Hide'; }
      else { input.type = 'password'; btn.textContent = 'Show'; }
    }

    async function doLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberMe').checked;
      if (!email || !password) { state.authError = 'Please enter both email and password. (Email aur password dono likhein.)'; render(); return; }
      state.authError = '';
      app.innerHTML = `<div class="center-loading"><div class="spinner"></div>Logging in…</div>`;
      try {
        await firebase.auth().setPersistence(remember ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION);
        await firebase.auth().signInWithEmailAndPassword(email, password);
      } catch (e) {
        state.authError = mapAuthError(e);
        render();
      }
    }

    async function doForgotPassword() {
      const email = document.getElementById('loginEmail').value.trim();
      if (!email) { state.authError = 'Enter your email above first, then click "Forgot password?" (Pehle upar email likhein.)'; render(); return; }
      try {
        await firebase.auth().sendPasswordResetEmail(email);
        showToast(`Password reset link sent to ${email}. Please check your inbox (and spam folder). (Reset link bhej diya hai.)`, 'success');
      } catch (e) {
        state.authError = mapAuthError(e);
        render();
      }
    }

    async function doSignup() {
      const name = document.getElementById('suName').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const department = document.getElementById('suDept').value.trim();
      const designation = document.getElementById('suDesig').value.trim();
      const password = document.getElementById('suPassword').value;
      const wantsSubadmin = document.querySelector('input[name=suRole]:checked').value === 'subadmin';

      if (!name || !email || !department || !designation || !password) {
        state.authError = 'Please fill in all fields. (Sab fields bharna zaroori hai.)'; render(); return;
      }
      if (password.length < 6) { state.authError = 'Password must be at least 6 characters. (Password kam az kam 6 characters ka ho.)'; render(); return; }

      state.authError = '';
      signupInProgress = true;
      app.innerHTML = `<div class="center-loading"><div class="spinner"></div>Creating your account…</div>`;

      // IP Restriction Check
      let detectedIp = window._detectedIp || '';
      const ipSettings = await sGet('settings:ip-restrictions');
      if (ipSettings && ipSettings.enabled && ipSettings.allowedIps && ipSettings.allowedIps.length > 0) {
        if (!detectedIp) {
          // Try to detect IP if not already detected
          try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            detectedIp = data.ip;
          } catch (e) { /* ignore */ }
        }
        const isAllowed = ipSettings.allowedIps.includes(detectedIp);
        if (!isAllowed) {
          signupInProgress = false;
          state.authError = `Registration blocked: Your IP address (${detectedIp || 'unknown'}) is not in the allowed list. Contact your Admin. (Aapka IP allowed list mein nahi hai.)`;
          render();
          return;
        }
      }

      let cred;
      try {
        cred = await firebase.auth().createUserWithEmailAndPassword(email, password);
      } catch (e) {
        signupInProgress = false;
        state.authError = mapAuthError(e);
        render();
        return;
      }

      try {
        const uid = cred.user.uid;
        const adminUid = await sGet('admin-uid');
        let role, status, requestedRole = null;
        if (!adminUid) {
          role = 'admin'; status = 'active';
          await sSet('admin-uid', uid);
        } else if (wantsSubadmin) {
          role = 'member'; status = 'pending'; requestedRole = 'subadmin';
        } else {
          role = 'member'; status = 'active';
        }
        const profile = { uid, name, email, department, designation, role, status, requestedRole, ip: detectedIp, createdAt: Date.now() };

        // Write directly (not via sSet) so we can catch and surface the REAL Firestore error if it fails
        await db.collection('quizData').doc('user:' + uid).set({ value: profile });

        const idx = (await sGet('users-index')) || [];
        idx.push(uid);
        await sSet('users-index', idx);

        state.user = cred.user;
        state.profile = profile;
        signupInProgress = false;
        showToast(`Account created successfully! Welcome, ${name}. (Account ban gaya hai!)`, 'success');
        routeAfterAuth();
      } catch (e) {
        signupInProgress = false;
        console.error('Signup profile-save error', e);
        state.authError = 'Your account login was created, but saving your profile failed. Raw error: ' + (e && e.message ? e.message : String(e)) + ' — this almost always means Firestore rules are not published yet. (Firestore rules publish karein.)';
        render();
      }
    }

      </div>
    </div>
  `;
    }

        case 'admin-upload-material': return renderAdminUploadMaterial();
        case 'academy-view': return renderAcademyView();

        case 'member-profile': return renderMemberProfile();

    async function detectAndShowIp() {
      const display = document.getElementById('detectedIpAddress');
      const displayFull = document.getElementById('detectedIpDisplay');
      if (!display) return;
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        display.textContent = data.ip;
        display.style.color = 'var(--ok-600)';
        window._detectedIp = data.ip;
        if (displayFull) displayFull.innerHTML = 'IP detected successfully';
      } catch (e) {
        display.textContent = 'Detection failed';
        display.style.color = 'var(--bad-600)';
        window._detectedIp = '';
        if (displayFull) displayFull.innerHTML = '<em>Could not detect IP (will register anyway)</em>';
      }
    }

    async function getPendingCount() {
      if (state.profile.role !== 'admin') return 0;
      const uids = (await sGet('users-index')) || [];
      const users = (await Promise.all(uids.map(uid => sGet('user:' + uid)))).filter(Boolean);
      return users.filter(u => u.status === 'pending').length;
    }

    function adminShell(active, innerHtml, pendingCount) {
      const lastUpdated = new Date().toLocaleString();
      return `

      <nav class="admin-sidebar">

        <button class="side-link ${active === 'assessments' ? 'active' : ''}" onclick="goto('admin-assessments')"><span class="ic">&#128203;</span> Assessments</button>
        <button class="side-link ${active === 'academy' ? 'active' : ''}" onclick="goto('admin-academy')"><span class="ic">&#127891;</span> Training Academy</button>
        <button class="side-link ${active === 'team' ? 'active' : ''}" onclick="goto('admin-team')"><span class="ic">&#128101;</span> Team${pendingCount > 0 ? ` <span class="side-badge">${pendingCount}</span>` : ''}</button>

      </nav>
      <div class="admin-main">${innerHtml}</div>
    </div>
  `;

          ${quizList.map(q => `<option value="${q.id}" ${meta.linkedQuizId === q.id ? 'selected' : ''}>${escapeHtml(q.title)} (${q.id})</option>`).join('')}

      <button class="btn btn-navy btn-block" onclick="saveLinkedAssessment('${materialId}')">Save</button>
    </div>
  `;

    async function saveLinkedAssessment(materialId) {
      const quizId = document.getElementById('linkQuizSelect').value || null;
      const meta = await sGet('training:' + materialId);
      meta.linkedQuizId = quizId;
      await sSet('training:' + materialId, meta);
      const list = (await sGet('training-list')) || [];
      const idx = list.findIndex(x => x.id === materialId);
      if (idx >= 0) { list[idx].linkedQuizId = quizId; await sSet('training-list', list); }

      goto('admin-academy');

      showToast('Approved as Sub-Admin', 'success');

      await sSet('user:' + uid, u);
      showToast('Request rejected', 'success');

      u.role = role; u.status = 'active'; u.requestedRole = null;

      showToast('Role updated', 'success');
      renderAdminTeam();

    async function deleteQuiz(id) {

      const list = (await sGet('quiz-list')) || [];

    function startCreateQuiz() {
      state._courseMode = false;
      state.activeQuiz = {
        id: null,
        title: '', description: '', timePerQ: 30, passPercent: 80,
        proctoring: { enabled: true, autoSubmitAfter: 5 },
        questions: [blankQuestion(30)]
      };
      goto('admin-create');
    }
    function blankQuestion(defaultTime) { return { text: '', description: '', type: 'mcq', options: ['', '', '', ''], optionExplanations: ['', '', '', ''], correct: 0, points: 10, timeLimit: defaultTime || 30 }; }

    async function startEditQuiz(id) {

    function renderAdminCreate() {

    <div class="card" style="margin-bottom:20px;">

    function questionBlockHtml(qq, i) {
      const isTF = qq.type === 'tf';
      const isMulti = qq.type === 'multi';
      const correctArr = Array.isArray(qq.correct) ? qq.correct : [qq.correct];
      return `
    <div class="q-block" data-qi="${i}">
      <span class="q-num">Q${i + 1}</span>
      ${i > 0 ? `<button class="q-remove" onclick="removeQuestion(${i})">Remove</button>` : ''}
      <div class="row3" style="margin-top:8px;">
        <div class="field" style="margin-bottom:12px;">
          <label>Question Type</label>
          <select onchange="updateQuestionType(${i}, this.value)">
            <option value="mcq" ${qq.type === 'mcq' ? 'selected' : ''}>Multiple Choice</option>
            <option value="multi" ${isMulti ? 'selected' : ''}>Multiple Select</option>
            <option value="tf" ${isTF ? 'selected' : ''}>True / False</option>
          </select>
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>Points</label>
          <input type="number" min="1" max="100" value="${qq.points}" oninput="updateQuestionField(${i},'points',parseInt(this.value)||10)" />
        </div>
        <div class="field" style="margin-bottom:12px;">
          <label>Time (seconds)</label>
          <input type="number" min="5" max="600" value="${qq.timeLimit || 30}" oninput="updateQuestionField(${i},'timeLimit',parseInt(this.value)||30)" />
        </div>
      </div>
      <div class="field">
        <label>Question</label>
        <textarea oninput="updateQuestionField(${i},'text',this.value)" placeholder="e.g. Under FATF guidelines, what is the primary purpose of a Suspicious Transaction Report?">${escapeHtml(qq.text)}</textarea>
      </div>
      <div class="field">
        <label>Question Description (Optional)</label>
        <textarea oninput="updateQuestionField(${i},'description',this.value)" placeholder="Explanation shown when answer is incorrect (visible to team members only)">${escapeHtml(qq.description)}</textarea>
      </div>
      ${isTF ? `
        ${['True', 'False'].map((label, oi) => `
          <div class="opt-row">
            <input type="radio" name="correct-${i}" ${qq.correct === oi ? 'checked' : ''} onchange="updateQuestionField(${i},'correct',${oi})" title="Mark as correct answer" />
            <div style="flex:1;padding:10px 13px;background:#fff;border:1.5px solid var(--line);border-radius:9px;font-weight:600;font-size:14.5px;">${label}</div>
          </div>
          <div class="field" style="margin-top:-8px;margin-bottom:12px;padding-left:36px;">
            <label>Explanation for ${label} (shown when selected)</label>
            <textarea oninput="updateQuestionField(${i},'optionExplanations',this.value,${oi})" placeholder="Why this option is right/wrong..." style="min-height:50px;">${escapeHtml((qq.optionExplanations || [])[oi] || '')}</textarea>
          </div>
        `).join('')}
      ` : isMulti ? `
        ${[0, 1, 2, 3].map(oi => `
          <div class="opt-row">
            <input type="checkbox" ${correctArr.includes(oi) ? 'checked' : ''} onchange="toggleMultiCorrect(${i},${oi})" title="Mark as one of the correct answers" />
            <input type="text" placeholder="Option ${String.fromCharCode(65 + oi)}" value="${escapeHtml(qq.options[oi] || '')}" oninput="updateOption(${i},${oi},this.value)" />
          </div>
          <div class="field" style="margin-top:-8px;margin-bottom:12px;padding-left:36px;">
            <label>Explanation for Option ${String.fromCharCode(65 + oi)} (shown when selected)</label>
            <textarea oninput="updateQuestionField(${i},'optionExplanations',this.value,${oi})" placeholder="Why this option is right/wrong..." style="min-height:50px;">${escapeHtml((qq.optionExplanations || [])[oi] || '')}</textarea>
          </div>
        `).join('')}
      ` : `
        ${[0, 1, 2, 3].map(oi => `
          <div class="opt-row">
            <input type="radio" name="correct-${i}" ${qq.correct === oi ? 'checked' : ''} onchange="updateQuestionField(${i},'correct',${oi})" title="Mark as correct answer" />
            <input type="text" placeholder="Option ${String.fromCharCode(65 + oi)}" value="${escapeHtml(qq.options[oi] || '')}" oninput="updateOption(${i},${oi},this.value)" />
          </div>
          <div class="field" style="margin-top:-8px;margin-bottom:12px;padding-left:36px;">
            <label>Explanation for ${String.fromCharCode(65 + oi)} (shown when selected)</label>
            <textarea oninput="updateQuestionField(${i},'optionExplanations',this.value,${oi})" placeholder="Why this option is right/wrong..." style="min-height:50px;">${escapeHtml((qq.optionExplanations || [])[oi] || '')}</textarea>
          </div>
        `).join('')}
      `}
      <div class="hint">${isMulti ? 'Check every box that is a correct answer (2 or more).' : 'Select the radio button beside the correct answer.'}</div>
    </div>
  `;
    }
    function toggleMultiCorrect(i, oi) {
      readQuizHeaderInputs();
      const q = state.activeQuiz.questions[i];
      if (!Array.isArray(q.correct)) q.correct = [];
      const idx = q.correct.indexOf(oi);
      if (idx >= 0) q.correct.splice(idx, 1); else q.correct.push(oi);
    }

    function readQuizHeaderInputs() {
      const q = state.activeQuiz;
      q.title = document.getElementById('qzTitle').value.trim();
      q.description = document.getElementById('qzDesc').value.trim();
      q.timePerQ = parseInt(document.getElementById('qzTime').value) || 30;
      q.passPercent = Math.min(100, Math.max(1, parseInt(document.getElementById('qzPass').value) || 80));
      q.proctoring = {
        enabled: document.getElementById('qzProctorEnabled').value === 'yes',
        autoSubmitAfter: parseInt(document.getElementById('qzAutoSubmit').value) || 0
      };
      const expEl = document.getElementById('qzExpires');
      const expOnEl = document.getElementById('qzExpiresOn');
      q.expiresDays = expEl ? (parseInt(expEl.value) || 30) : (q.expiresDays || 30);
      q.expiresOn = expOnEl ? (expOnEl.value || '') : (q.expiresOn || '');
    }
    function updateQuestionField(i, field, value, optIdx) {
      readQuizHeaderInputs();
      if (field === 'optionExplanations' && optIdx !== undefined) {
        if (!Array.isArray(state.activeQuiz.questions[i].optionExplanations)) {
          state.activeQuiz.questions[i].optionExplanations = ['', '', '', ''];
        }
        state.activeQuiz.questions[i].optionExplanations[optIdx] = value;
        return;
      }
      state.activeQuiz.questions[i][field] = value;
    }
    function updateOption(i, oi, value) {
      readQuizHeaderInputs();
      state.activeQuiz.questions[i].options[oi] = value;
    }
    function updateQuestionType(i, type) {
      readQuizHeaderInputs();
      const q = state.activeQuiz.questions[i];
      const wasMulti = Array.isArray(q.correct);
      q.type = type;
      if (type === 'tf') {
        q.options = ['True', 'False'];
        q.correct = wasMulti ? (q.correct[0] ?? 0) : (q.correct > 1 ? 0 : q.correct);
      } else if (type === 'multi') {
        if (q.options.length !== 4) { q.options = ['', '', '', '']; }
        q.correct = wasMulti ? q.correct : [];
      } else {
        if (q.options.length !== 4) { q.options = ['', '', '', '']; }
        q.correct = wasMulti ? (q.correct[0] ?? 0) : q.correct;
      }
      renderAdminCreate();
    }
    function addQuestion() {
      readQuizHeaderInputs();
      state.activeQuiz.questions.push(blankQuestion(state.activeQuiz.timePerQ));
      renderAdminCreate();
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
    function removeQuestion(i) {
      readQuizHeaderInputs();
      state.activeQuiz.questions.splice(i, 1);
      renderAdminCreate();
    }
    function cancelCreate() {
      const isCourse = !!state._courseMode;
      if (!confirm(`Discard this ${isCourse ? 'course' : 'assessment'} draft?`)) return;
      state.activeQuiz = null;
      state._courseMode = false;
      goto(isCourse ? 'admin-academy' : 'admin-assessments');
    }

    async function publishCourse() {
      readQuizHeaderInputs();
      const q = state.activeQuiz;
      const fileInput = document.getElementById('courseFile');
      const file = fileInput.files[0];
      const audienceEl = document.querySelector('input[name=courseAudience]:checked');
      const audience = audienceEl ? audienceEl.value : 'all';
      const departments = audience === 'dept' ? [...document.querySelectorAll('.courseDeptBox:checked')].map(el => el.value) : [];

      if (!q.title) { showToast('Please enter a title. (Title likhein.)', 'error'); return; }
      if (!file) { showToast('Please select a training file. (File select karein.)', 'error'); return; }
      if (audience === 'dept' && departments.length === 0) { showToast('Select at least one department, or choose "All Departments". (Kam az kam ek department select karein.)', 'error'); return; }
      if (q.questions.length === 0) { showToast('Please add at least one question. (Kam az kam ek question add karein.)', 'error'); return; }
      for (let i = 0; i < q.questions.length; i++) {
        const qq = q.questions[i];
        if (!qq.text.trim()) { showToast(`Question ${i + 1}: please enter the question text. (Text likhein.)`, 'error'); return; }
        if (qq.type !== 'tf' && qq.options.some(o => !o.trim())) { showToast(`Question ${i + 1}: please fill all four options. (Chaaron options bharein.)`, 'error'); return; }
        if (qq.type === 'multi' && (!Array.isArray(qq.correct) || qq.correct.length < 2)) { showToast(`Question ${i + 1}: check at least 2 correct options for Multiple Select. (Kam az kam 2 sahi options check karein.)`, 'error'); return; }
      }

      const isPdf = file.name.toLowerCase().endsWith('.pdf');
      const isPptx = file.name.toLowerCase().endsWith('.pptx');
      if (!isPdf && !isPptx) { showToast('Only .pdf or .pptx files are allowed. (Sirf .pdf ya .pptx file allowed hai.)', 'error'); return; }

      let pages = [];
      try {
        pages = isPdf ? await extractPdfPages(file) : await extractPptxSlides(file);
      } catch (e) {
        console.error(e);
        showToast('Could not read this file: ' + e.message + ' (File parse nahi ho saki.)', 'error');
        return;
      }
      if (pages.length === 0) { showToast('No content was found in this file. (Is file se koi content nahi mila.)', 'error'); return; }

      // 1) Create the quiz (assessment half)
      q.id = genId(6);
      q.createdBy = state.profile.name;
      q.createdByUid = state.profile.uid;
      q.createdAt = Date.now();
      q.questionCount = q.questions.length;
      await sSet('quiz:' + q.id, q);
      const quizList = (await sGet('quiz-list')) || [];
      quizList.push({ id: q.id, title: q.title, createdBy: q.createdBy, createdAt: q.createdAt, questionCount: q.questionCount, timePerQ: q.timePerQ, passPercent: q.passPercent, proctoring: q.proctoring });
      await sSet('quiz-list', quizList);

      // 2) Process training pages (with narration explanation attempts)
      const materialId = genId(6);
      for (let i = 0; i < pages.length; i++) {
        showProcessingProgress(i, pages.length, `Preparing ${isPdf ? 'page' : 'slide'} ${i + 1} of ${pages.length}…`);
        const explanationEN = await callClaudeExplain(pages[i].rawText, q.title, 'en');
        await sSet(`training-page:${materialId}:${i}`, {
          pageIndex: i, rawText: pages[i].rawText, imageDataUrl: pages[i].imageDataUrl || null,
          slideImages: pages[i].slideImages || [], explanationEN, explanationUR: null
        });
      }

      // 3) Create the training material, linked to the quiz — ONE code (materialId) for the whole course
      await sSet('training:' + materialId, {
        id: materialId, title: q.title, type: isPdf ? 'pdf' : 'pptx', pageCount: pages.length, departments,
        createdBy: state.profile.name, createdByUid: state.profile.uid, createdAt: Date.now(), linkedQuizId: q.id
      });
      const trainingList = (await sGet('training-list')) || [];
      trainingList.push({ id: materialId, title: q.title, type: isPdf ? 'pdf' : 'pptx', pageCount: pages.length, departments, createdBy: state.profile.name, createdAt: Date.now(), linkedQuizId: q.id });
      await sSet('training-list', trainingList);

      state._courseMode = false;
      showMaterialPublished(materialId, q.title, departments);
    }

    async function publishQuiz() {
      readQuizHeaderInputs();
      const q = state.activeQuiz;
      if (!q.title) { showToast('Please enter an assessment title. (Assessment ka title likhein.)', 'error'); return; }
      if (q.questions.length === 0) { showToast('Please add at least one question. (Kam az kam ek question add karein.)', 'error'); return; }
      for (let i = 0; i < q.questions.length; i++) {
        const qq = q.questions[i];
        if (!qq.text.trim()) { showToast(`Question ${i + 1}: please enter the question text. (Text likhein.)`, 'error'); return; }
        if (qq.type !== 'tf' && qq.options.some(o => !o.trim())) { showToast(`Question ${i + 1}: please fill all four options. (Chaaron options bharein.)`, 'error'); return; }
        if (qq.type === 'multi' && (!Array.isArray(qq.correct) || qq.correct.length < 2)) { showToast(`Question ${i + 1}: check at least 2 correct options for Multiple Select. (Kam az kam 2 sahi options check karein.)`, 'error'); return; }
      }

      const isEdit = !!q.id;
      if (!isEdit) {
        q.id = genId(6);
        q.createdBy = state.profile.name;
        q.createdByUid = state.profile.uid;
        q.createdAt = Date.now();
      }
      q.questionCount = q.questions.length;

      const saved = await sSet('quiz:' + q.id, q);
      if (!saved) { showToast('Could not save, please try again. (Save nahi ho saka, dobara koshish karein.)', 'error'); return; }

      const list = (await sGet('quiz-list')) || [];
      const summary = {
        id: q.id, title: q.title, createdBy: q.createdBy, createdAt: q.createdAt,
        questionCount: q.questionCount, timePerQ: q.timePerQ, passPercent: q.passPercent, proctoring: q.proctoring
      };
      if (isEdit) {
        const idx = list.findIndex(x => x.id === q.id);
        if (idx >= 0) list[idx] = summary; else list.push(summary);
      } else {
        list.push(summary);
      }
      await sSet('quiz-list', list);

      showToast(isEdit ? 'Assessment updated!' : 'Assessment published!', 'success');
      if (isEdit) { goto('admin-assessments'); } else { showPublishedCode(q); }
    }

    function showPublishedCode(q) {
      app.innerHTML = `
    <div class="wrap narrow" style="padding-top:10px;">
      <div class="code-display">
        <div class="lbl">Assessment Ready — Share This Code</div>
        <div class="code">${q.id}</div>
      </div>
      <div class="card" style="text-align:center;">
        <h3 style="margin-top:0;">${escapeHtml(q.title)}</h3>
        <p style="color:var(--ink-600);font-size:13.5px;">${q.questionCount} questions &middot; ${q.timePerQ}s each &middot; Pass mark ${q.passPercent}%</p>
        <p style="color:var(--ink-600);font-size:13.5px;">Team members log in, go to their home screen, and enter this code.</p>

    function formatDurationLabel(ms) {
      const totalSeconds = Math.max(0, Math.round((ms || 0) / 1000));
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${mins}m ${secs.toString().padStart(2, '0')}s`;
    }

    function attemptTypeLabel(a) {
      if (a.isRetake && a.isPostExpiryUnlock) return 'Retake (Post-Expiry Unlock)';
      if (a.isPostExpiryUnlock) return 'Post-Expiry Unlock';
      if (a.isRetake) return 'Retake';
      return 'Original';
    }

    async function exportResultsToExcel(quizId) {
      await ensureXlsx();
      showToast('Preparing Excel file…');
      const quiz = await sGet('quiz:' + quizId);
      const attemptIds = (await sGet('attempts-index:' + quizId)) || [];
      const attempts = (await Promise.all(attemptIds.map(aid => sGet('attempt:' + quizId + ':' + aid)))).filter(Boolean);
      if (!quiz || attempts.length === 0) { showToast('No data to export', 'error'); return; }
      const totalPoints = quiz.questions.reduce((s, q) => s + q.points, 0);
      attempts.sort((a, b) => b.score - a.score || a.durationMs - b.durationMs);

      const rows = attempts.map((a, i) => {
        const pct = Math.round(a.score / totalPoints * 100);
        return {
          'Rank': i + 1,
          'Name': a.name,
          'Department': a.department || '',
          'Designation': a.designation || '',
          'Score': a.score,
          'Total Points': totalPoints,
          'Percent': pct,
          'Status': pct >= quiz.passPercent ? 'Passed' : 'Needs Retake',
          'Attempt Type': attemptTypeLabel(a),
          'Retake': a.isRetake ? 'Yes' : 'No',
          'Post-Expiry Unlock': a.isPostExpiryUnlock ? 'Yes' : 'No',
          'Time Taken (s)': Math.round(a.durationMs / 1000),
          'Attempted At': new Date(a.startedAt).toLocaleString(),
          'Integrity Flags': (a.violations || []).length,
          'Auto-Submitted': a.flagged ? 'Yes' : 'No'
        };
      });

      try {
        const ws = XLSX.utils.json_to_sheet(rows);
        ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: Math.max(k.length, 14) }));
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Results');
        const safeName = quiz.title.replace(/[^a-z0-9]+/gi, '_').slice(0, 50);
        XLSX.writeFile(wb, safeName + '_results.xlsx');
        showToast('Excel file downloaded', 'success');
      } catch (e) {
        console.error(e);
        showToast('Export failed, try again', 'error');
      }
    }

    function drawCertPreview() {

    async function handleCertFileUpload(inputEl) {
      const file = inputEl.files[0];
      if (!file) return;
      showToast('Processing image…');
      try {
        const dataUrl = await compressImageFile(file, 1400, 0.78);
        state._certDraft.dataUrl = dataUrl;
        renderAdminCertificate();
        showToast('Image ready — set the name position below', 'success');
      } catch (e) {
        showToast(e.message || 'Could not process the image. (Image process nahi ho saka.)', 'error');
      }
    }

    function compressImageFile(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round(h * (maxWidth / w)); w = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            let q = quality;
            let out = canvas.toDataURL('image/jpeg', q);
            let tries = 0;
            while (out.length > 700000 && tries < 5) {
              q = Math.max(q - 0.15, 0.3);
              out = canvas.toDataURL('image/jpeg', q);
              tries++;
            }
            if (out.length > 950000) { reject(new Error('Image is still too large — try a smaller or simpler image. (Chhoti ya simpler image try karein.)')); return; }
            resolve(out);
          };
          img.onerror = () => reject(new Error('This file could not be opened as an image. (Yeh file image ki tarah nahi khul saki.)'));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Could not read the file. (File read nahi ho saki.)'));
        reader.readAsDataURL(file);
      });
    }

      const quiz = state._certQuiz;

    async function downloadCertificate(quizId) {
      showToast('Preparing certificate…');
      const cert = await sGet('cert-template:' + quizId);
      const quiz = await sGet('quiz:' + quizId);
      if (!cert || !cert.dataUrl) { showToast('Certificate is not available yet. (Certificate abhi available nahi hai.)', 'error'); return; }
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        ctx.font = `700 ${cert.fontSize}px "${cert.fontFamily}"`;
        ctx.fillStyle = cert.fontColor;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(state.profile.name, canvas.width * (cert.posX / 100), canvas.height * (cert.posY / 100));
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const safeTitle = (quiz ? quiz.title : 'Assessment').replace(/[\\/:*?"<>|]/g, '');
          const safeName = state.profile.name.replace(/[\\/:*?"<>|]/g, '');
          a.download = `Certificate - ${safeTitle} - ${safeName}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast('Certificate downloaded', 'success');
        }, 'image/png');
      };
      img.onerror = () => showToast('Could not load the certificate. (Certificate load nahi ho saka.)', 'error');
      img.src = cert.dataUrl;
    }

    async function callClaudeExplain(pageText, materialTitle, language) {
      if (!pageText || pageText.trim().length < 15) {
        return buildLocalExplanation(pageText || '', materialTitle, language);
      }
      const fallback = buildLocalExplanation(pageText, materialTitle, language);
      try {
        const apiKey = window.CLAUDE_API_KEY || localStorage.getItem('claudeApiKey');
        if (!apiKey) { return fallback; }
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01'
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            messages: [{ role: 'user', content: `Explain the following training content clearly for compliance staff. Keep it concise and practical.\n\nTitle: ${materialTitle}\n\nContent:\n${pageText.slice(0, 3000)}` }]
          })
        });
        if (!response.ok) { return fallback; }
        const data = await response.json();
        const text = (data.content || []).map(b => b.text || '').join('\n').trim();
        return text || fallback;
      } catch (e) {
        console.error('Claude explain error', e);
        return fallback;
      }
    }
